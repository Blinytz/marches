// Fiche événement/marché (9.4) + ticket de transaction (9.5).
// Les transactions sont confirmées par les RPC atomiques Supabase.
//
// Structure du ticket revue pour la clarté (retour utilisateur 22/07) :
//  - on choisit d'abord un CAMP (OUI ou NON) via deux boutons de prix explicites ;
//  - le mode Vendre n'apparaît que si une position existe, via un encart « Votre position »
//    qui propose Renforcer et Vendre. Plus de double bascule OUI/NON + Acheter/Vendre.

let ticket = null; // { marcheId, issueId, mode, montant, parts, etape, prixServeur, recu }

function ouvrirTicket(marcheId, issueId, mode = "achat") {
  const m = marche(marcheId);
  const pos = etat.positions.find((x) => x.marcheId === marcheId);
  // Pour une vente on force l'issue détenue et on part sur la totalité des parts.
  if (mode === "vente" && pos) {
    ticket = { marcheId, issueId: pos.issueId, mode: "vente", montant: 250, parts: pos.parts, etape: "saisie" };
  } else {
    ticket = { marcheId, issueId: issueId || (pos ? pos.issueId : issuePrincipale(m).id), mode: "achat", montant: 250, parts: null, etape: "saisie" };
  }
}

function prixIndicatif(m, issueId, mode = "achat") {
  const issue = m.issues.find((i) => i.id === issueId);
  if (!issue || issue.prob == null || issue.prob <= 0 || issue.prob >= 1) return null;
  // Chaque camp est coté à partir de SA probabilité, plus le spread (moitié de part
  // et d'autre du prix). Le carnet public ne concerne que le
  // camp affiché, on ne s'en sert donc pas pour coter le camp opposé.
  const demiSpread = (m.source === "MANIFOLD" ? 0.01 : (m.spread ?? 0.02) / 2);
  const p = issue.prob;
  return mode === "achat"
    ? Math.min(0.99, p + demiSpread)
    : Math.max(0.01, p - demiSpread);
}

function encartPosition(m, pos, t) {
  const val = valeurPosition(pos);
  const pl = plLatent(pos);
  const p = probIssue(m, pos.issueId);
  return `<div class="ticket-position">
    <div class="tp-ligne"><span>Votre position</span>
      <span class="pos-issue ${pos.issueId === "non" ? "non" : "oui"}">${echap(pos.issueLabel)}</span></div>
    <div class="tp-chiffres">
      <span>${fmt(pos.parts)} parts</span><span>·</span>
      <span>valeur ${val != null ? fmt(val) : "?"}</span><span>·</span>
      <span class="${pl >= 0 ? "vert" : "rouge"}">Résultat ${pl != null ? fmtSigne(pl) : "?"}</span>
    </div>
    <div class="ticket-actions-pos">
      <button class="btn ${t.mode === "achat" ? "btn-principal" : "btn-discret"}" data-ticket="renforcer">Renforcer</button>
      <button class="btn ${t.mode === "vente" ? "btn-principal" : "btn-discret"}" data-ticket="vendre">Vendre</button>
    </div>
  </div>`;
}

function htmlTicket(m) {
  if (!m.tradable || m.status !== "OPEN") {
    return `<div class="ticket"><h3>Transaction indisponible</h3>
      <p class="muet">${echap(m.nonTradableReason || (m.status === "CLOSED"
        ? "Marché fermé : résolution en attente de l'oracle source."
        : "Ce marché est terminé."))}</p>
      ${m.status === "CLOSED" ? `<p class="tres-muet">Règles et source de résolution ci-contre. Aucun paiement avant la décision officielle de la source.</p>` : ""}
    </div>`;
  }
  if (!ticket || ticket.marcheId !== m.id) ouvrirTicket(m.id, issuePrincipale(m).id);
  const t = ticket;
  const pos = etat.positions.find((x) => x.marcheId === m.id);
  const vn = etat.valeurNominale;
  const binaire = m.marketType === "BINARY";
  const issue = m.issues.find((i) => i.id === t.issueId) || m.issues[0];

  // ---- Succès ----
  if (t.etape === "succes") {
    const r = t.recu;
    const estVente = t.mode === "vente";
    return `<div class="ticket eclat-anim joue">
      <h3>✅ ${estVente ? "Vente exécutée" : "Achat exécuté"}</h3>
      <div class="recu">
        <div><span>Marché</span><strong style="text-align:right; max-width:60%">${echap(m.titleOriginal.slice(0, 60))}${m.titleOriginal.length > 60 ? "…" : ""}</strong></div>
        <div><span>Camp</span><strong>${echap(issue.label)}</strong></div>
        <div><span>${estVente ? "Produit crédité" : "Montant débité"}</span><strong>${fmtEclats(r.montant)}</strong></div>
        <div><span>Frais</span><strong>0 Éclats</strong></div>
        <div><span>Parts</span><strong>${fmt(r.parts)}</strong></div>
        <div><span>Prix moyen</span><strong>${fmt(r.prix)}</strong></div>
        ${!estVente ? `<div><span>Paiement maximal</span><strong>${fmtEclats(r.parts * vn)}</strong></div>
        <div><span>Bénéfice maximal</span><strong class="vert">+${fmt(r.parts * vn - r.montant)}</strong></div>` : ""}
        <div><span>Transaction</span><span class="id-support">${r.id}</span></div>
      </div>
      <a class="btn btn-principal" href="#/enjeu">Voir ma position</a>
      <button class="btn btn-discret" data-ticket="reinit">Nouvelle transaction</button>
      <p class="ticket-note">Transaction confirmée dans le registre commun des Éclats.</p>
    </div>`;
  }

  // ---- Confirmation ----
  if (t.etape === "confirmation") {
    const pServeur = t.prixServeur;
    const estVente = t.mode === "vente";
    const pEstime = prixIndicatif(m, t.issueId, t.mode);
    const ecartPts = Math.abs(pServeur - pEstime) * 100;
    const horsTolerance = ecartPts > 2 || Math.abs(pServeur - pEstime) / pEstime > 0.05;
    const parts = estVente ? t.parts : t.montant / (pServeur * vn);
    const valeur = estVente ? parts * pServeur * vn : t.montant;
    return `<div class="ticket">
      <h3>Confirmer ${estVente ? "la vente" : "l'achat"}</h3>
      <div class="ticket-detail">
        <div><dt>Camp</dt><dd>${echap(issue.label)}</dd></div>
        <div><dt>Prix vérifié à l'instant</dt><dd class="num"><strong>${fmt(pServeur * vn)}</strong></dd></div>
        <div><dt>Votre estimation</dt><dd class="num">${fmt(pEstime * vn)}</dd></div>
        <div><dt>Parts</dt><dd class="num">${fmt(parts)}</dd></div>
        <div><dt>${estVente ? "Produit crédité" : "Paiement maximal"}</dt><dd class="num">${fmt(estVente ? valeur : parts * vn)}</dd></div>
      </div>
      ${horsTolerance ? `<div class="ticket-avert">⚠ Le prix a bougé de ${fmt(ecartPts)} points depuis votre saisie,
        au-delà de la tolérance (2 pts ou 5 %). Vérifiez le nouveau prix avant de confirmer à nouveau.</div>` : ""}
      <button class="btn btn-principal" data-ticket="executer" ${t.enCours ? "disabled" : ""}>
        ${t.enCours ? "Ordre en cours…" : horsTolerance ? "Confirmer au nouveau prix" : `${estVente ? "Vendre" : "Acheter"} ${echap(issue.label)} · ${fmtEclats(estVente ? valeur : t.montant)}`}
      </button>
      <button class="btn btn-discret" data-ticket="retour">Retour</button>
    </div>`;
  }

  // ---- Saisie : VENTE ----
  if (t.mode === "vente" && pos) {
    const p = prixIndicatif(m, pos.issueId, "vente");
    const prixU = p != null ? p * vn : null;
    if (t.parts == null || t.parts > pos.parts) t.parts = pos.parts;
    const produit = prixU != null ? t.parts * prixU : 0;
    const partsOk = t.parts > 0 && t.parts <= pos.parts;
    return `<div class="ticket">
      ${encartPosition(m, pos, t)}
      <h3>Vendre ${echap(pos.issueLabel)}</h3>
      <label class="muet" for="ticket-parts">Parts à vendre (sur ${fmt(pos.parts)})</label>
      <input id="ticket-parts" class="champ num" type="number" min="0" max="${pos.parts}" step="0.01"
        value="${fmt(t.parts)}" data-ticket="parts">
      <div class="raccourcis">
        ${[["25 %", 0.25], ["50 %", 0.5], ["75 %", 0.75], ["Tout", 1]].map(([lib, f]) =>
          `<button data-ticket="parts-frac" data-val="${f}">${lib}</button>`).join("")}
      </div>
      <div class="ticket-detail">
        <div><dt>Prix de vente (${m.source === "POLYMARKET" ? "meilleur bid" : "miroir -1"})</dt><dd class="num">${prixU != null ? fmt(prixU) : "?"}</dd></div>
        <div><dt>Produit estimé</dt><dd class="num">${fmt(produit)}</dd></div>
        <div><dt>Spread</dt><dd class="num">${m.spread != null ? fmt(m.spread * 100) + " pts" : "?"}</dd></div>
        <div><dt>Frais</dt><dd class="num">0</dd></div>
      </div>
      ${!partsOk ? `<div class="ticket-erreur">Indiquez un nombre de parts entre 0 et ${fmt(pos.parts)}.</div>` : ""}
      <p class="ticket-note">Le produit est crédité immédiatement après vérification du prix côté serveur. La vente ne modifie jamais le prix externe.</p>
      <button class="btn btn-principal" data-ticket="previsualiser" ${partsOk && prixU != null ? "" : "disabled"}>
        Vendre ${fmt(t.parts)} parts · ≈ ${fmtEclats(produit)}
      </button>
    </div>`;
  }

  // ---- Saisie : ACHAT ----
  const p = prixIndicatif(m, t.issueId, "achat");
  const prixU = p != null ? p * vn : null;
  const soldeDispo = etat.solde ?? 0;
  const montantOk = t.montant >= 10 && t.montant <= 10000;
  const soldeOk = t.montant <= soldeDispo;
  const parts = prixU ? t.montant / prixU : 0;
  const profondeurInsuffisante = m.profondeurFaible && t.montant > 25;

  const choixCamp = binaire
    ? `<div class="ticket-cotes">
        ${["oui", "non"].map((id) => {
          const iss = m.issues.find((i) => i.id === id);
          const px = prixIndicatif(m, id, "achat");
          return `<button class="cote cote-${id} ${t.issueId === id ? "actif" : ""}" data-ticket="cote" data-val="${id}">
            <span class="cote-label">${id === "oui" ? "OUI" : "NON"}</span>
            <span class="cote-prix">${px != null ? fmt(px * vn) : "?"}</span>
            <span class="cote-note">${iss?.prob != null ? pct(iss.prob) + " de proba" : ""}</span>
          </button>`;
        }).join("")}
      </div>`
    : `<label class="muet" for="ticket-issue-select">Réponse</label>
       <select id="ticket-issue-select" class="champ" data-ticket="issue-select" aria-label="Réponse">
        ${m.issues.map((i) => `<option value="${i.id}" ${i.id === t.issueId ? "selected" : ""}>${echap(i.label)} · ${pct(i.prob)}</option>`).join("")}
       </select>`;

  return `<div class="ticket">
    ${pos ? encartPosition(m, pos, t) : ""}
    <h3>${pos ? "Renforcer votre position" : "Prendre position"}</h3>
    <p class="ticket-note" style="margin-top:-4px">Choisissez le camp sur lequel miser. Le prix est le coût d'une part ; une part gagnante paie ${vn} Éclats.</p>
    ${choixCamp}
    ${m.source === "MANIFOLD" ? `<p class="ticket-note">Prix miroir Manifold : probabilité publique + 1 point de spread local. Aucun ordre réel n'est placé chez Manifold.</p>` : ""}
    <label class="muet" for="ticket-montant">Combien miser ?</label>
    <input id="ticket-montant" class="champ num" type="number" min="10" max="10000" step="10"
      value="${t.montant}" data-ticket="montant">
    <div class="raccourcis">
      ${[50, 100, 250, 500].map((v) => `<button data-ticket="rapide" data-val="${v}">${v}</button>`).join("")}
      <button data-ticket="rapide" data-val="${Math.floor(soldeDispo)}">Max</button>
    </div>
    <div class="ticket-detail">
      <div><dt>Prix d'une part ${m.source === "POLYMARKET" ? "(meilleur ask)" : "(miroir +1)"}</dt><dd class="num">${prixU != null ? fmt(prixU) : "?"}</dd></div>
      <div><dt>Parts estimées</dt><dd class="num">${fmt(parts)}</dd></div>
      <div><dt>Spread</dt><dd class="num">${m.spread != null ? fmt(m.spread * 100) + " pts" : "?"}</dd></div>
      <div><dt>Frais</dt><dd class="num">0</dd></div>
      <div><dt>Paiement potentiel</dt><dd class="num">${fmt(parts * vn)}</dd></div>
      <div><dt>Bénéfice potentiel</dt><dd class="num vert">+${fmt(Math.max(0, parts * vn - t.montant))}</dd></div>
    </div>
    ${!etat.compteConnecte ? `<div class="ticket-erreur">Connectez votre portefeuille Éclats avant de miser.</div>` : ""}
    ${ticket.erreur ? `<div class="ticket-erreur">${echap(ticket.erreur)}</div>` : ""}
    ${!montantOk ? `<div class="ticket-erreur">Mise entre 10 et 10 000 Éclats (réglages Économie).</div>` : ""}
    ${!soldeOk ? `<div class="ticket-erreur">Solde insuffisant : ${fmtEclats(soldeDispo)} disponibles.
      <a href="#/portefeuille" style="text-decoration:underline">Voir le portefeuille</a></div>` : ""}
    ${profondeurInsuffisante ? `<div class="ticket-avert">⚠ Profondeur du carnet insuffisante pour ce montant :
      seuls ${fmtEclats(25)} sont exécutables. L'ordre serait partiellement exécuté (réglage : exécutions partielles autorisées).</div>` : ""}
    <p class="ticket-note">Le prix affiché est une estimation : la confirmation utilisera le prix revérifié côté serveur.</p>
    <button class="btn btn-principal" data-ticket="previsualiser" ${etat.compteConnecte && montantOk && soldeOk && prixU != null ? "" : "disabled"}>
      Acheter ${echap(issue.label)} · ${fmtEclats(t.montant)}
    </button>
  </div>`;
}

function htmlCarnet(m) {
  if (m.source === "MANIFOLD") {
    return `<div class="panneau"><h3>Prix miroir Manifold</h3>
      <p class="prose">Manifold ne publie pas de carnet d'ordres. Le prix appliqué localement est la probabilité publique du marché,
        avec un spread local symétrique de 1 point : achat OUI à ${pct(Math.min(0.99, (issuePrincipale(m).prob ?? 0) + 0.01))},
        vente OUI à ${pct(Math.max(0.01, (issuePrincipale(m).prob ?? 0) - 0.01))}.
        Ce prix n'est jamais un ordre réel placé chez Manifold.</p></div>`;
  }
  if (m.detailEtat === "chargement") {
    return `<div class="panneau"><h3>Carnet d'ordres</h3><div class="skeleton" style="height:150px"></div></div>`;
  }
  if (!m.carnet || (!m.carnet.bids.length && !m.carnet.asks.length)) {
    return `<div class="panneau"><h3>Carnet d'ordres</h3>${etatVide("📭", "Carnet vide", "Aucune liquidité affichable pour l'instant : les transactions sont suspendues.")}</div>`;
  }
  const maxTaille = Math.max(...m.carnet.bids.map((b) => b[1]), ...m.carnet.asks.map((a) => a[1]));
  const ligne = (l, cls) => `<div class="carnet-ligne ${cls}">
      <span class="barre" style="width:${(l[1] / maxTaille) * 100}%"></span>
      <span class="num">${fmt(l[0] * 100)}</span><span class="num tres-muet">${fmtCompact(l[1])}</span>
    </div>`;
  return `<div class="panneau"><h3>Carnet d'ordres</h3>
    <div class="carnet">
      <span class="col-titre">Achats (bids)</span><span class="col-titre">Ventes (asks)</span>
      <div>${m.carnet.bids.map((b) => ligne(b, "bid")).join("")}</div>
      <div>${m.carnet.asks.map((a) => ligne(a, "ask")).join("")}</div>
    </div>
    ${m.profondeurFaible ? `<p class="ticket-avert" style="margin-top:8px">⚠ Profondeur très faible : les gros montants seront refusés ou partiellement exécutés.</p>` : ""}
  </div>`;
}

// Interactions du ticket (délégation accrochée par app.js après chaque rendu de fiche)
function accrocherTicket(rerendre, zoneForcee = null) {
  const zone = zoneForcee || document.getElementById("zone-ticket") || document.getElementById("feuille-basse");
  if (!zone) return;
  if (zone.dataset.ticketEcoute === "1") return;
  zone.dataset.ticketEcoute = "1";
  zone.addEventListener("input", (e) => {
    if (!ticket) return;
    const m = e.target.closest("[data-ticket=montant]");
    if (m) { ticket.montant = Math.max(0, Number(m.value) || 0); rafraichirSansFocus(rerendre); }
    const p = e.target.closest("[data-ticket=parts]");
    if (p) { ticket.parts = Math.max(0, Number(p.value) || 0); rafraichirSansFocus(rerendre); }
  });
  zone.addEventListener("change", (e) => {
    const sel = e.target.closest("[data-ticket=issue-select]");
    if (sel && ticket) { ticket.issueId = sel.value; rerendre(); }
  });
  zone.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-ticket]");
    if (!b || !ticket) return;
    const type = b.dataset.ticket;
    const m = marche(ticket.marcheId);
    const pos = etat.positions.find((x) => x.marcheId === ticket.marcheId);
    if (type === "cote") { ticket.issueId = b.dataset.val; ticket.mode = "achat"; rerendre(); }
    if (type === "renforcer") { ticket.mode = "achat"; if (pos) ticket.issueId = pos.issueId; rerendre(); }
    if (type === "vendre") { if (pos) { ticket.mode = "vente"; ticket.issueId = pos.issueId; ticket.parts = pos.parts; } rerendre(); }
    if (type === "rapide") { ticket.montant = Number(b.dataset.val); rerendre(); }
    if (type === "parts-frac" && pos) { ticket.parts = Math.round(pos.parts * Number(b.dataset.val) * 100) / 100; rerendre(); }
    if (type === "retour") { ticket.etape = "saisie"; rerendre(); }
    if (type === "reinit") { ouvrirTicket(ticket.marcheId, ticket.issueId, "achat"); rerendre(); }
    if (type === "previsualiser") {
      const p = prixIndicatif(m, ticket.issueId, ticket.mode);
      ticket.prixServeur = Math.min(0.99, Math.max(0.01, p));
      ticket.etape = "confirmation";
      rerendre();
    }
    if (type === "executer") {
      if (ticket.enCours) return;
      ticket.enCours = true;
      ticket.erreur = null;
      rerendre();
      try {
        const resultat = await executerOrdre({
          marche: m,
          issueId: ticket.issueId,
          mode: ticket.mode,
          montant: ticket.montant,
          parts: ticket.parts,
          idempotencyKey: `marches:${crypto.randomUUID()}`
        });
        ticket.recu = {
          id: resultat.id,
          montant: Number(resultat.montant),
          prix: Number(resultat.prix),
          parts: Number(resultat.parts)
        };
        ticket.etape = "succes";
      } catch (erreur) {
        ticket.erreur = erreur.message;
        ticket.etape = "saisie";
      } finally {
        ticket.enCours = false;
      }
      rerendre();
    }
  });
}

function rafraichirSansFocus(rerendre) {
  const actif = document.activeElement;
  const id = actif?.id;
  const posCurseur = actif?.selectionStart;
  rerendre();
  if (id) {
    const el = document.getElementById(id);
    if (el) { el.focus(); try { el.selectionStart = el.selectionEnd = posCurseur; } catch {} }
  }
}

function ticketPourFeuille(marcheId, issueId) {
  ouvrirTicket(marcheId, issueId);
  return htmlTicket(marche(marcheId));
}
function htmlTicketCourant() {
  if (!ticket) return "";
  return htmlTicket(marche(ticket.marcheId));
}

const SEGMENTS = [

];

function segmentDe(pos) {
  const m = marche(pos.marcheId);
  if (!m) return "tous";
  if (m.status === "CLOSED") return "fermes";
  const restant = m.expectedResolutionAt ? new Date(m.expectedResolutionAt) - Date.now() : Infinity;
  if (restant < 24 * 3600e3) return "bientot";
  if (restant > 30 * 24 * 3600e3) return "long";
  return "actifs";
}

function cartePosition(pos, deplie) {
  const m = marche(pos.marcheId);
  if (!m) return "";
  const p = probIssue(m, pos.issueId);
  const val = valeurPosition(pos);
  const pl = plLatent(pos);
  const plPctv = pl != null ? (pl / pos.montantExpose) * 100 : null;
  const deltaPts = p != null ? (p - pos.probEntree) * 100 : null;
  const favorable = deltaPts != null && deltaPts >= 0;
  const paiement = paiementPotentiel(pos);
  const histo = historiqueIssue(pos);
  const echeanceProche = m.expectedResolutionAt && new Date(m.expectedResolutionAt) - Date.now() < 24 * 3600e3 && m.status === "OPEN";
  const retarde = m.donneesRetardees;

  const message = m.status === "CLOSED"
    ? "Marché fermé : en attente de la décision de l'oracle source."
    : p == null ? "Prix momentanément indisponible : dernier état conservé."
    : favorable
      ? `Le marché vous est actuellement favorable : ${fmtSigne(deltaPts)} points depuis votre achat.`
      : `Le marché vous est actuellement défavorable : ${fmtSigne(deltaPts)} points depuis votre achat.`;

  return `<div class="carte carte-position" data-pos="${pos.id}">
    <div class="pos-entetes">
      ${imgMarche(m)}
      <a class="carte-titre" style="flex:1" href="#/marche/${m.id}">${echap(m.titleOriginal)}</a>
      ${badgeSource(m.source)}
      <span class="pos-issue ${pos.issueId === "non" ? "non" : "oui"}">${echap(pos.issueLabel)}</span>
      ${retarde ? `<span class="pastille pastille-warn">Données retardées</span>` : fraicheur(m)}
    </div>
    <div class="pos-chiffres">
      <div class="bloc"><span class="lib">Engagé</span><span class="val num">${fmt(pos.montantExpose)}</span></div>
      <div class="bloc"><span class="lib">Entrée → actuel</span>
        <span class="val num">${fmt(pos.probEntree * 100)} → ${p != null ? fmt(p * 100) : "?"}
        ${deltaPts != null ? `<span class="${favorable ? "vert" : "rouge"}">(${fmtSigne(deltaPts)} pts)</span>` : ""}</span></div>
      <div class="bloc"><span class="lib">Valeur actuelle</span><span class="val num">${val != null ? fmt(val) : "?"}</span></div>
      <div class="bloc"><span class="lib">Résultat latent</span>
        <span class="val num ${pl >= 0 ? "vert" : "rouge"}">${pl != null ? `${fmtSigne(pl)} (${fmtSigne(plPctv)} %)` : "?"}</span></div>
      <div class="bloc"><span class="lib">Paiement potentiel</span><span class="val num">${fmt(paiement)}</span></div>
      ${sparkline(histo, { depuis: new Date(pos.achatAt).getTime(), ligne: pos.probEntree })}
    </div>
    <p class="pos-message">${message}</p>
    <div class="pos-pied">
      <span class="tres-muet">${m.status === "CLOSED" ? "Fermé · résolution en attente" : libelleEcheance(m)}</span>
      ${echeanceProche ? `<span class="compte-rebours" data-rebours="${m.expectedResolutionAt}">${compteReboursCourt(m.expectedResolutionAt)}</span>` : ""}
      <span style="flex:1"></span>
      <a class="btn btn-discret" href="#/marche/${m.id}">Voir</a>
      ${m.status === "OPEN" && m.tradable ? `
        <a class="btn btn-discret" href="#/marche/${m.id}?issue=${pos.issueId}&mode=achat&t=1">Renforcer</a>
        <a class="btn" href="#/marche/${m.id}?issue=${pos.issueId}&mode=vente&t=1">Vendre</a>` : ""}
      <button class="btn btn-discret" data-action="deplier-pos" data-pos="${pos.id}">${deplie ? "Replier" : "Détail"}</button>
    </div>
    ${deplie ? `<div class="pos-detail">
      <div class="graphique-conteneur">${grapheDetaille(histo, {
        ligneEntree: pos.probEntree,
        marqueurs: [
          ...pos.lots.map((l) => ({ t: new Date(l.date).getTime(), type: "achat", titre: `Achat : ${fmt(l.parts)} parts à ${fmt(l.prixUnitaire)}` })),
          ...(pos.ventes || []).map((v) => ({ t: new Date(v.t).getTime(), type: "vente", titre: `Vente : ${fmt(v.parts)} parts à ${fmt(v.prixUnitaire)}` }))
        ]
      })}</div>
      <p class="tres-muet">La courbe suit la probabilité de l'issue détenue (${echap(pos.issueLabel)}), depuis le premier achat. Points verts : achats · points rouges : ventes · ligne pointillée : prix moyen d'entrée.</p>
      <h3>Lots (FIFO)</h3>
      <div class="defilement-x"><table class="tableau"><thead><tr><th>Date</th><th>Parts restantes</th><th>Prix unitaire</th><th>Valeur nominale</th></tr></thead>
      <tbody>${pos.lots.map((l) => `<tr><td>${new Date(l.date).toLocaleDateString("fr-FR")}</td>
        <td class="num">${fmt(l.parts)}</td><td class="num">${fmt(l.prixUnitaire)}</td><td class="num">${fmt(l.valeurNominale)} Éclats</td></tr>`).join("")}</tbody></table></div>
      <h3>Chronologie</h3>
      <ul class="chronologie">${pos.chronologie.map((c) => `<li><span class="tres-muet">${new Date(c.t).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span> · ${echap(c.texte)}</li>`).join("")}</ul>
    </div>` : ""}
  </div>`;
}

function pageEnjeu({ query }) {
  if (etat.chargementCompte) {
    return `<h1>Mes positions</h1><div class="enjeu-entete skeleton" style="height:90px"></div>
      ${Array(3).fill('<div class="carte skeleton" style="height:150px; margin-top:12px"></div>').join("")}`;
  }
  const positions = etat.positions;
  if (!positions.length) {
    return `<h1>Mes positions</h1>` + etatVide("🎯", "Aucune position ouverte",
      "Achetez OUI ou NON sur un marché : votre position vivra ici, avec sa courbe, son résultat et son échéance.",
      `<a class="btn btn-principal" href="#/recherche?horizon=24&tradable=1">Voir les marchés courts</a>`);
  }

  const segment = query.seg || "tous";
  const deplie = query.detail || null;
  const claims = claimsOuverts();

  const enrichies = positions.map((pos) => ({ pos, seg: segmentDe(pos), pl: plLatent(pos) }));
  const visibles = segment === "tous" ? enrichies
    : segment === "recuperer" ? []
    : enrichies.filter((x) => x.seg === segment);

  const totalExpose = positions.reduce((s, p) => s + p.montantExpose, 0);
  const totalValeur = enrichies.reduce((s, x) => s + (valeurPosition(x.pos) ?? x.pos.montantExpose), 0);
  const totalPl = totalValeur - totalExpose;
  const paiementMax = positions.reduce((s, p) => s + paiementPotentiel(p), 0);
  const favorables = enrichies.filter((x) => (x.pl ?? 0) >= 0).length;
  const prochaine = positions
    .map((p) => marche(p.marcheId)?.expectedResolutionAt).filter(Boolean)
    .sort((a, b) => new Date(a) - new Date(b))[0];

  const tri = query.tri || "echeance";
  visibles.sort((a, b) => {
    if (tri === "pl") return (b.pl ?? -1e9) - (a.pl ?? -1e9);
    if (tri === "pire") return (a.pl ?? 1e9) - (b.pl ?? 1e9);
    if (tri === "enjeu") return b.pos.montantExpose - a.pos.montantExpose;
    const ea = marche(a.pos.marcheId)?.expectedResolutionAt || "9999";
    const eb = marche(b.pos.marcheId)?.expectedResolutionAt || "9999";
    return new Date(ea) - new Date(eb);
  });

  const lienSeg = (s) => `#/enjeu?seg=${s}${tri !== "echeance" ? "&tri=" + tri : ""}`;
  const compteSeg = (s) => s === "recuperer" ? claims.length : s === "tous" ? enrichies.length : enrichies.filter((x) => x.seg === s).length;

  return `
    <h1>Mes positions</h1>
    <div class="enjeu-entete">
      <div class="bloc"><span class="lib muet">Positions ouvertes</span><div class="val num" style="font-size:1.25rem; font-weight:700">${positions.length}</div></div>
      <div class="bloc"><span class="lib muet">Encore exposé</span><div class="val num" style="font-size:1.25rem; font-weight:700">${fmt(totalExpose)}</div></div>
      <div class="bloc"><span class="lib muet">Valeur liquidative</span><div class="val num" style="font-size:1.25rem; font-weight:700">${fmt(totalValeur)}</div></div>
      <div class="bloc"><span class="lib muet">Résultat latent</span><div class="val num ${totalPl >= 0 ? "vert" : "rouge"}" style="font-size:1.25rem; font-weight:700">${fmtSigne(totalPl)} (${fmtSigne((totalPl / totalExpose) * 100)} %)</div></div>
      <div class="bloc"><span class="lib muet">Paiement maximal</span><div class="val num" style="font-size:1.25rem; font-weight:700">${fmt(paiementMax)}</div></div>
      <div class="bloc"><span class="lib muet">Prochaine échéance</span><div class="val compte-rebours" data-rebours="${prochaine || ""}">${prochaine ? compteReboursCourt(prochaine) : "?"}</div></div>
      <div class="bloc"><span class="lib muet">Favorables / défavorables</span><div class="val num"><span class="vert">${favorables}</span> / <span class="rouge">${positions.length - favorables}</span></div></div>
    </div>

    <div class="segments">
      ${SEGMENTS.map((s) => `<a class="chip ${segment === s.cle ? "actif" : ""}" href="${lienSeg(s.cle)}">${s.lib}${compteSeg(s.cle) ? ` · ${compteSeg(s.cle)}` : ""}</a>`).join("")}
    </div>
    <div class="chips">
      <span class="tres-muet" style="align-self:center">Trier :</span>
      ${[["echeance", "Échéance"], ["pl", "Meilleur résultat"], ["pire", "Pire résultat"], ["enjeu", "Plus gros enjeu"]].map(([c, l]) =>
        `<a class="chip ${tri === c ? "actif" : ""}" href="#/enjeu?seg=${segment}&tri=${c}">${l}</a>`).join("")}
    </div>

    ${segment === "recuperer"
      ? (claims.length
          ? claims.map((c) => `<div class="carte carte-claim" style="margin-bottom:12px">
              <div class="pos-entetes">${badgeSource(c.source)}<strong style="flex:1">${echap(c.titre)}</strong>
                <span class="claim-montant num">${fmt(c.montant)}</span></div>
              <p class="pos-message">${c.type === "REMBOURSEMENT" ? "Marché annulé par la source : remboursement de votre coût restant." : "Issue gagnante : " + echap(c.issueLabel)}</p>
              <a class="btn btn-claim" href="#/resultats">Récupérer dans Résultats</a>
            </div>`).join("")
          : etatVide("🏆", "Rien à récupérer pour le moment"))
      : visibles.length
        ? visibles.map((x) => cartePosition(x.pos, deplie === x.pos.id)).join("")
        : etatVide("🗂️", "Aucune position dans ce segment")}
  `;
}

function pageStats() {

      "Les statistiques sont calculées uniquement à partir de vos transactions réelles.");

function progression(valeur, cible) {
  const atteint = valeur >= cible;
  const pct = Math.min(100, Math.round((valeur / Math.max(1, cible)) * 100));
  return { valeur, cible, atteint, pct };
}

function carteSucces(icone, nom, description, p) {
  return `<div class="badge-jalon ${p.atteint ? "obtenu" : "verrouille"}">
    <span class="bj-ico">${icone}</span>
    <span class="bj-nom">${echap(nom)}</span>
    <span class="bj-etat">${p.atteint ? "Obtenu" : `${p.valeur} / ${p.cible}`}</span>
    <div class="succes-progression" aria-label="${p.pct} %"><span style="width:${p.pct}%"></span></div>
    <small class="tres-muet">${echap(description)}</small>
  </div>`;
}

function groupe(titre, aide, succes) {
  const obtenus = succes.filter((s) => s[3].atteint).length;
  return `<details class="panneau succes-groupe" open>
    <summary><strong>${titre}</strong><span class="pastille">${obtenus} / ${succes.length}</span></summary>
    <p class="tres-muet">${echap(aide)}</p>
    <div class="badges">${succes.map((s) => carteSucces(...s)).join("")}</div>
  </details>`;
}

  const groupes = [
    ["Premiers pas", "Découvrir le fonctionnement des marchés et du portefeuille.", [

    ]],

      ["🧭", "Explorateur", "Parier sur 3 thèmes différents.", progression(themes.size, 3)],
      ["🌍", "Grand angle", "Parier sur 5 thèmes différents.", progression(themes.size, 5)]
    ]],
    ["Expérience", "Accumuler un historique suffisamment riche pour apprendre.", [
      ["📘", "Apprenti", "Atteindre 5 paris résolus.", progression(resolus, 5)],
      ["📚", "Habitué", "Atteindre 10 paris résolus.", progression(resolus, 10)],
      ["🎓", "Vétéran", "Atteindre 25 paris résolus.", progression(resolus, 25)]
    ]],
    ["Résultats", "Transformer les bonnes prévisions en résultats récupérés.", [
      ["🥉", "Un bon départ", "Obtenir 1 gain.", progression(gagnes.length, 1)],
      ["🥈", "Série positive", "Obtenir 3 gains.", progression(gagnes.length, 3)],
      ["🥇", "Confirmé", "Obtenir 10 gains.", progression(gagnes.length, 10)]

}

// ---------- Animation de récupération d'un claim ----------

function animerTransfertClaim(depuisEl, montant) {
  const solde = document.getElementById("solde-valeur");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !depuisEl) {
    solde.classList.add("solde-flash");
    setTimeout(() => solde.classList.remove("solde-flash"), 800);
    return;
  }
  const dep = depuisEl.getBoundingClientRect();
  const arr = solde.getBoundingClientRect();
  const formes = ["✦", "◆", "●", "✧", "★"];
  const couleurs = ["#F5A518", "#6B4EF6", "#FF5FA2", "#10B981", "#FFC948"];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement("span");
    p.className = "particule";
    p.textContent = formes[i % formes.length];
    p.style.color = couleurs[i % couleurs.length];
    p.style.fontSize = `${0.7 + Math.random() * 0.7}rem`;
    const jitterX = (Math.random() - 0.5) * dep.width;
    p.style.left = `${dep.left + dep.width / 2 + jitterX}px`;
    p.style.top = `${dep.top + dep.height / 2}px`;
    document.body.appendChild(p);
    requestAnimationFrame(() => {
      setTimeout(() => {
        // La moitié converge vers le solde, l'autre gicle façon confettis.
        if (i % 2 === 0) {
          p.style.transform = `translate(${arr.left - dep.left - jitterX + arr.width / 2}px, ${arr.top - dep.top}px) scale(0.4) rotate(${Math.random() * 360}deg)`;
        } else {
          p.style.transform = `translate(${(Math.random() - 0.5) * 220}px, ${60 + Math.random() * 120}px) rotate(${Math.random() * 540}deg)`;
        }
        p.style.opacity = "0";
      }, i * 28);
    });
    setTimeout(() => p.remove(), 1000 + i * 28);
  }
  // Compteur : de l'ancien au nouveau solde
  const cible = etat.solde;
  const depart = cible - montant;
  const t0 = performance.now();
  const duree = 650;
  function tick(t) {
    const x = Math.min(1, (t - t0) / duree);
    solde.textContent = `◇ ${fmt(depart + (cible - depart) * (1 - Math.pow(1 - x, 3)))}`;
    if (x < 1) requestAnimationFrame(tick);
  }
  setTimeout(() => {
    solde.classList.add("solde-flash");
    requestAnimationFrame(tick);
    setTimeout(() => solde.classList.remove("solde-flash"), 900);
  }, 500);
}

// ---------- Délégation d'événements globale ----------

document.body.addEventListener("click", async (e) => {
  const fav = e.target.closest("[data-fav]");
  if (fav) { e.preventDefault(); basculerFavori(fav.dataset.fav); rendre(); return; }

  const act = e.target.closest("[data-action]");
  if (!act) return;
  const a = act.dataset.action;

  if (a === "ticket") {
    e.preventDefault();
    location.hash = `#/marche/${act.dataset.marche}?issue=${act.dataset.issue}&t=1`;
  }
  if (a === "ticket-mobile") {
    e.preventDefault();
    ouvrirFeuille(ticketPourFeuille(act.dataset.marche, act.dataset.issue));
  }
  if (a === "recuperer") {
    e.preventDefault();
    const bouton = act;
    const carte = bouton.closest("[data-claim-carte]");
    bouton.disabled = true;
    bouton.textContent = "Récupération…";
    try {
      const res = await recupererClaim(bouton.dataset.claim);
      carte?.classList.add("joue");
      animerTransfertClaim(bouton, res.montant);
      setTimeout(() => rendre(), 750);
    } catch {
      rendre(); // état relu : le bouton reflète la réalité (jamais deviné)
    }
  }
  if (a === "deplier-pos") {
    e.preventDefault();
    const r = routeCourante();
    const dejaOuvert = r.query.detail === act.dataset.pos;
    const q = new URLSearchParams({ ...r.query });
    if (dejaOuvert) q.delete("detail"); else q.set("detail", act.dataset.pos);
    location.hash = `#/enjeu?${q.toString()}`;
  }
  if (a === "basculer-theme") { basculerTheme(); rendre(); }
  if (a === "tout-lu") { marquerToutLu(); rendre(); }
  if (a === "lire-notif") { marquerNotifLue(act.dataset.notif); }
  if (a === "suivre-theme") {
    const t = act.dataset.theme;
    const i = etat.prefs.themesSuivis.indexOf(t);
    if (i >= 0) etat.prefs.themesSuivis.splice(i, 1); else etat.prefs.themesSuivis.push(t);
    notifier(); rendre();
  }
  if (a === "suivre-region") {
    const r = act.dataset.region;
    const i = etat.prefs.regionsSuivies.indexOf(r);
    if (i >= 0) etat.prefs.regionsSuivies.splice(i, 1); else etat.prefs.regionsSuivies.push(r);
    notifier(); rendre();
  }
  if (a === "demasquer") {
    e.preventDefault();
    etat.prefs.masques = etat.prefs.masques.filter((t) => t !== act.dataset.theme);
    notifier(); rendre();
  }
  if (a === "enregistrer-filtre") {
    act.textContent = "✓ Filtre enregistré dans Ma liste";
    etat.prefs.filtresEnregistres.push({ id: "f" + Date.now(), nom: "Filtre du " + new Date().toLocaleDateString("fr-FR"), criteres: "Critères actuels de la recherche" });
    notifier();
  }
  if (a === "notif-test") {
    act.textContent = "✓ Notification de test envoyée au centre interne";
  }
  if (a === "exporter-donnees") {
    telechargerExportEclatsMarches(etat, { userId: etat.compteUtilisateur?.id || "non-connecte" });
    act.textContent = "✓ Export téléchargé";
  }
  if (a === "ouvrir-connexion") document.getElementById("dialogue-connexion").showModal();
  if (a === "fermer-connexion") document.getElementById("dialogue-connexion").close();
  if (a === "deconnexion") {
    deconnexion();
    await chargerCompteReel();
    rendre();
  }
});

// Recherche globale (entête) et recherche de page
document.getElementById("champ-recherche").addEventListener("keydown", (e) => {
  if (e.key === "Enter") location.hash = `#/recherche?q=${encodeURIComponent(e.target.value)}`;
});
document.body.addEventListener("keydown", (e) => {
  const el = e.target;
  if (el.id === "champ-recherche-page" && e.key === "Enter") {
    const r = routeCourante();
    const q = new URLSearchParams({ ...r.query, q: el.value });
    location.hash = `#/recherche?${q.toString()}`;
  }
  if (el.closest?.("[data-action=filtre-reglages]") && e.key === "Enter") {
    location.hash = `#/parametres?n=systeme&f=${encodeURIComponent(el.value)}`;
  }
});
window.addEventListener("keydown", (e) => {
  if ((e.key === "/" || (e.key.toLowerCase() === "k" && (e.ctrlKey || e.metaKey))) &&
      !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
    e.preventDefault();
    document.getElementById("champ-recherche").focus();
  }
});

// ---------- Feuille basse mobile ----------

const voile = document.getElementById("voile");
const feuille = document.getElementById("feuille-basse");
function ouvrirFeuille(html) {
  feuille.innerHTML = html;
  feuille.hidden = false;
  voile.hidden = false;
  accrocherTicket(() => { feuille.innerHTML = htmlTicketCourant(); }, feuille);
}
voile.addEventListener("click", () => { feuille.hidden = true; voile.hidden = true; });

document.getElementById("formulaire-connexion").addEventListener("submit", async (e) => {
  e.preventDefault();
  const erreur = document.getElementById("erreur-connexion");
  erreur.hidden = true;
  const donnees = new FormData(e.currentTarget);
  try {
    await connexion(donnees.get("email"), donnees.get("password"));
    await chargerCompteReel();
    document.getElementById("dialogue-connexion").close();
    e.currentTarget.reset();
    rendre();
  } catch (cause) {
    erreur.textContent = cause.message;
    erreur.hidden = false;
  }
});

setInterval(() => {
  document.querySelectorAll("[data-rebours]").forEach((el) => {
    if (el.dataset.rebours) el.textContent = compteReboursCourt(el.dataset.rebours);
  });
}, 1000);

// ---------- Service worker (PWA installable) ----------

if (false) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

majEntete();
rendre();
chargerDonneesReelles().then(() => rendre()).catch(() => rendre());
chargerCompteReel().then(() => rendre()).catch(() => rendre());

</script>
