<title>Marchés · données réelles</title>
<style>
/* Marchés · système visuel « vif, clair et ludique »
   Direction validée le 22/07 : thème clair moderne, coloré, avec des touches de jeu.
   Pas de thème sombre. L'app assume l'aspect « jeu en Éclats ».

   Univers : Éclats = éclats de gemme -> violet joyau + or scintillant.
   Neutres légèrement teintés violet (choisis, jamais du gris pur). */

:root {
  color-scheme: light;

  /* Fonds et surfaces */
  --bg: #F1F0FB;              /* lavande très clair */
  --bg-2: #E9E7F8;
  --surface-1: #FFFFFF;
  --surface-2: #F5F4FD;
  --surface-3: #EDEBFA;
  --border: #E4E1F4;
  --border-fort: #D6D1EE;

  /* Textes (bias violet, pas de gris pur) */
  --text-1: #1B1735;
  --text-2: #5B5580;
  --text-3: #938DB4;

  /* Accent principal : violet joyau */
  --accent: #6B4EF6;
  --accent-hover: #5A3DE8;
  --accent-soft: #ECE7FF;
  --accent-fond: rgba(107, 78, 246, 0.13);  /* remplissage des courbes SVG */
  --accent-2: #FF5FA2;       /* rose : célébrations, touches ludiques */

  /* Monnaie Éclats : or scintillant (couleur d'écosystème) */
  --eclats: #F5A518;
  --eclats-fonce: #D98A00;
  --eclats-soft: #FFF3DA;

  /* OUI / NON vifs */
  --yes: #10B981;
  --yes-fonce: #0E9E6E;
  --yes-soft: #DBF6EC;
  --no: #F5484E;
  --no-fonce: #DE2E34;
  --no-soft: #FEE2E3;

  /* Sémantique */
  --warning: #F5A518;
  --warning-soft: #FFF3DA;
  --info: #3B82F6;
  --info-soft: #E0EDFF;
  --success: #10B981;

  /* Gradients ludiques */
  --grad-accent: linear-gradient(135deg, #7A5CFF 0%, #6B4EF6 55%, #8E3BF0 100%);
  --grad-eclats: linear-gradient(135deg, #FFC948 0%, #F5A518 100%);
  --grad-yes: linear-gradient(135deg, #34D9A0 0%, #10B981 100%);

  /* Ombres douces (jamais de bordures lourdes en clair) */
  --ombre-1: 0 1px 2px rgba(27, 23, 53, 0.05), 0 2px 8px rgba(27, 23, 53, 0.05);
  --ombre-2: 0 4px 14px rgba(27, 23, 53, 0.08), 0 2px 6px rgba(27, 23, 53, 0.05);
  --ombre-3: 0 12px 32px rgba(60, 40, 160, 0.16);
  --ombre-accent: 0 6px 18px rgba(107, 78, 246, 0.32);

  --r-carte: 18px;
  --r-bouton: 12px;
  --r-pill: 999px;

  --police: "Segoe UI Variable", "Segoe UI", ui-rounded, "SF Pro Rounded",
            system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg); }

body {
  margin: 0;
  font-family: var(--police);
  background:
    radial-gradient(1100px 520px at 88% -8%, #EDE4FF 0%, transparent 55%),
    radial-gradient(900px 460px at -6% 4%, #FFE9F4 0%, transparent 50%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text-1);
  font-size: 15px;
  line-height: 1.5;
  padding-bottom: 82px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
@media (min-width: 768px) { body { padding-bottom: 0; } }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; }
h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin: 0.4rem 0 0.9rem; text-wrap: balance; }
h2 { font-size: 1.08rem; font-weight: 700; letter-spacing: -0.01em; margin: 1.6rem 0 0.6rem; }
h3 { font-size: 0.95rem; font-weight: 700; margin: 0.4rem 0; }

.num, .proba, .solde, .montant, .compte-rebours, td.num, .cote-prix, .fiche-proba, .proba-principale {
  font-variant-numeric: tabular-nums;
}
.muet { color: var(--text-2); font-size: 0.85rem; }
.tres-muet { color: var(--text-3); font-size: 0.8rem; }
.vert { color: var(--yes-fonce); }
.rouge { color: var(--no-fonce); }
.orange { color: var(--eclats-fonce); }

/* ===================== En-tête ===================== */

#entete {
  position: sticky; top: 0; z-index: 40;
  height: 64px;
  display: flex; align-items: center; gap: 16px;
  padding: 0 16px;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.logo { font-weight: 800; font-size: 1.08rem; white-space: nowrap; letter-spacing: -0.02em; }
.logo { color: var(--accent); }
.logo-texte {
  background: var(--grad-accent); -webkit-background-clip: text; background-clip: text; color: transparent;
}

#recherche-globale { flex: 1; max-width: 520px; }
#champ-recherche {
  width: 100%;
  background: var(--surface-2);
  border: 1.5px solid transparent;
  color: var(--text-1);
  border-radius: var(--r-pill);
  padding: 9px 16px;
  outline: none;
  transition: border-color 120ms, background 120ms;
}
#champ-recherche::placeholder { color: var(--text-3); }
#champ-recherche:focus { border-color: var(--accent); background: var(--surface-1); }

.entete-droite { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.indicateur-tr {
  font-size: 0.78rem; font-weight: 600; color: var(--yes-fonce); white-space: nowrap;
  background: var(--yes-soft); padding: 4px 10px; border-radius: var(--r-pill);
}
.indicateur-tr.off { color: var(--eclats-fonce); background: var(--eclats-soft); }
#bouton-notifs { position: relative; font-size: 1.15rem; line-height: 1; }

#bloc-solde {
  display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15;
  background: var(--eclats-soft); padding: 5px 14px; border-radius: var(--r-pill);
  border: 1px solid #F3D89A;
}
.solde { font-weight: 800; white-space: nowrap; color: var(--eclats-fonce); }
.solde-claims { font-size: 0.68rem; font-weight: 700; color: var(--accent); white-space: nowrap; }

/* Badge de notifications non vues (alerte) */
.badge-compte {
  position: absolute; top: -7px; right: -9px;
  background: var(--accent-2); color: white;
  font-size: 0.64rem; font-weight: 800;
  border-radius: var(--r-pill); padding: 1px 6px;
  box-shadow: 0 2px 6px rgba(255, 95, 162, 0.5);
}
/* Compteur informatif (nombre de positions ouvertes) : neutre, pas une alerte */
.badge-nombre {
  display: inline-block; background: var(--accent-soft); color: var(--accent);
  font-size: 0.66rem; font-weight: 800; border-radius: var(--r-pill);
  padding: 1px 7px; margin-left: 6px;
}
#nav-principale a.actif .badge-nombre { background: rgba(255, 255, 255, 0.28); color: #fff; }
#nav-mobile .badge-nombre { position: absolute; top: 4px; right: 50%; transform: translateX(24px); margin: 0; }
/* Point d'action : uniquement quand quelque chose vous attend (Éclats à récupérer) */
.badge-point { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-2); margin-left: 6px; }
.badge-point.or { background: var(--eclats); box-shadow: 0 0 0 3px var(--eclats-soft); }
#nav-mobile .badge-point { position: absolute; top: 6px; right: 50%; transform: translateX(20px); margin: 0; }

/* ============ Navigation en 3 piliers (desktop) ============ */

#nav-principale {
  position: sticky; top: 64px; z-index: 30;
  display: flex; gap: 6px; align-items: center;
  height: 54px; padding: 0 12px;
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
#nav-principale::-webkit-scrollbar { display: none; }
#nav-principale a {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  color: var(--text-2); font-weight: 700; font-size: 0.94rem;
  padding: 9px 15px; border-radius: var(--r-pill); position: relative;
  transition: background 120ms, color 120ms;
}
#nav-principale a.actif { color: #fff; background: var(--grad-accent); box-shadow: var(--ombre-accent); }
#nav-principale a:not(.actif):hover { color: var(--accent); background: var(--accent-soft); }
.np-ico { font-size: 1.08rem; line-height: 1; }
/* L'Éclat est la monnaie : il reste doré en toutes circonstances, y compris
   quand l'onglet est sélectionné (sur la pastille violette, l'or ressort bien). */
.np-ico.eclat, .mnav-ico.eclat { color: var(--eclats); }
#nav-principale a.actif .np-ico.eclat { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25); }

/* Sous-navigation contextuelle */
#sous-nav {
  position: sticky; top: 118px; z-index: 29;
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
#sous-nav:empty { display: none; }
#sous-nav a {
  color: var(--text-2); font-weight: 600; font-size: 0.85rem;
  padding: 6px 14px; border-radius: var(--r-pill);
  background: var(--surface-1); box-shadow: inset 0 0 0 1.5px var(--border);
  transition: color 120ms, box-shadow 120ms, background 120ms;
}
#sous-nav a.actif { color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
#sous-nav a:not(.actif):hover { color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }

#btn-recherche-mobile { display: none; font-size: 1.15rem; line-height: 1; }

@media (max-width: 767px) {
  #entete { height: 58px; gap: 10px; }
  #nav-principale { display: none; }
  #sous-nav { top: 58px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  #sous-nav::-webkit-scrollbar { display: none; }
  #sous-nav a { white-space: nowrap; }
  .logo-texte, #recherche-globale, .indicateur-tr { display: none; }
  #btn-recherche-mobile { display: inline-flex; }
}

/* ===================== Navigation mobile ===================== */

#nav-mobile {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  display: flex;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -4px 20px rgba(27, 23, 53, 0.06);
}
#nav-mobile a {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 2px 11px;
  font-size: 0.56rem; font-weight: 700; letter-spacing: -0.01em;
  color: var(--text-3);
  min-height: 48px;
  position: relative;
}
#nav-mobile a span:not(.mnav-ico):not(.badge-point) { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#nav-mobile a.actif { color: var(--accent); }
#nav-mobile a.actif .mnav-ico {
  background: var(--accent-soft); transform: translateY(-1px);
}
.mnav-ico {
  font-size: 1.1rem; line-height: 1;
  width: 40px; height: 26px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-pill); transition: background 140ms, transform 140ms;
}
@media (min-width: 768px) { #nav-mobile { display: none; } }

/* ===================== Bandeaux d'état ===================== */

#bandeaux { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
.bandeau {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-top: 12px; padding: 11px 16px;
  border-radius: 14px;
  font-size: 0.9rem; font-weight: 500;
  background: var(--surface-1);
  box-shadow: var(--ombre-1);
}
.bandeau-panne { background: var(--no-soft); color: var(--no-fonce); }
.bandeau-ws { background: var(--warning-soft); color: var(--eclats-fonce); }
.bandeau-claim {
  background: var(--grad-eclats); color: #4a2e00; font-weight: 600;
  box-shadow: var(--ombre-2);
}
.bandeau .btn { margin-left: auto; flex-shrink: 0; }

/* ===================== Contenu ===================== */

main { max-width: 1440px; margin: 0 auto; padding: 14px 16px 56px; }
main:focus { outline: none; }

.rangee-titre { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 10px; }
.rangee-titre h2 { margin: 0; }
.rangee-titre .lien-tout { margin-left: auto; font-size: 0.82rem; font-weight: 700; color: var(--accent); }

.rangee-cartes {
  display: grid; grid-auto-flow: column; grid-auto-columns: 266px;
  gap: 14px; overflow-x: auto; padding: 4px 2px 12px;
  scroll-snap-type: x proximity; scrollbar-width: none;
}
.rangee-cartes::-webkit-scrollbar { display: none; }
.rangee-cartes > * { scroll-snap-align: start; }

.grille-cartes {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px;
}

/* ===================== Carte marché ===================== */

.carte {
  background: var(--surface-1);
  border-radius: var(--r-carte);
  padding: 14px;
  display: flex; flex-direction: column; gap: 9px;
  position: relative;
  box-shadow: var(--ombre-1);
  transition: transform 140ms ease, box-shadow 140ms ease;
}
.carte > *, .carte-haut > *, .ligne-compacte > *, .ligne-issue > *,
.pos-entetes > *, .carte-editoriale > * { min-width: 0; }
a.carte:hover, .carte-marche:hover { transform: translateY(-3px); box-shadow: var(--ombre-2); }

.carte-haut { display: flex; gap: 11px; align-items: flex-start; }
.carte-img {
  width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;
  object-fit: cover; background: var(--surface-3);
  display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
  box-shadow: inset 0 0 0 1px rgba(27,23,53,0.04);
}
.carte-titre {
  font-weight: 700; font-size: 0.92rem; line-height: 1.34;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere; letter-spacing: -0.01em;
}
.carte-etoile {
  margin-left: auto; flex-shrink: 0;
  background: none; border: none; font-size: 1.1rem; color: var(--text-3);
  padding: 2px; line-height: 1; transition: transform 120ms;
}
.carte-etoile:hover { transform: scale(1.18); }
.carte-etoile.actif { color: var(--eclats); }

.carte-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.75rem; color: var(--text-3); }

.badge-source {
  font-size: 0.64rem; font-weight: 800; letter-spacing: 0.4px;
  border-radius: 7px; padding: 2px 7px; text-transform: uppercase;
}
.badge-source.polymarket { background: var(--info-soft); color: #2563EB; }
.badge-source.manifold { background: var(--accent-soft); color: var(--accent); }

.pastille {
  border-radius: var(--r-pill); padding: 2px 10px; font-size: 0.72rem; font-weight: 600;
  white-space: nowrap; color: var(--text-2); background: var(--surface-2);
}
.pastille-ok { color: var(--yes-fonce); background: var(--yes-soft); }
.pastille-warn { color: var(--eclats-fonce); background: var(--eclats-soft); }
.pastille-off { color: var(--text-3); background: var(--surface-2); }
.pastille-no { color: var(--no-fonce); background: var(--no-soft); }

.carte-proba { display: flex; align-items: baseline; gap: 8px; }
.proba-principale { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
.variation { font-size: 0.78rem; font-weight: 700; }
.variation.up { color: var(--yes-fonce); }
.variation.down { color: var(--no-fonce); }
.variation.flat { color: var(--text-3); }

.carte-pied { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-3); margin-top: auto; flex-wrap: wrap; }

.boutons-oui-non { display: flex; gap: 9px; }
.btn-oui, .btn-non {
  flex: 1; border-radius: var(--r-bouton); border: none;
  padding: 9px 4px; font-weight: 800; font-size: 0.84rem;
  min-height: 38px; transition: transform 100ms, filter 120ms;
}
.btn-oui { background: var(--yes-soft); color: var(--yes-fonce); }
.btn-oui:hover { background: var(--yes); color: #fff; }
.btn-non { background: var(--no-soft); color: var(--no-fonce); }
.btn-non:hover { background: var(--no); color: #fff; }
.btn-oui:active, .btn-non:active { transform: scale(0.97); }

/* Liste compacte */
.liste-compacte { display: flex; flex-direction: column; padding: 4px; }
.ligne-compacte {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 10px; border-radius: 12px;
}
.ligne-compacte + .ligne-compacte { border-top: 1px solid var(--border); }
.ligne-compacte:hover { background: var(--surface-2); }
.ligne-compacte .carte-titre { -webkit-line-clamp: 2; flex: 1; font-weight: 600; }
.ligne-compacte .proba-principale { font-size: 1.1rem; }
@media (max-width: 640px) {
  .ligne-compacte .variation { display: none; }
  .ligne-compacte { flex-wrap: wrap; }
}

/* Carte éditoriale */
.carte-editoriale { grid-column: 1 / -1; flex-direction: row; gap: 18px; padding: 18px; }
.carte-editoriale .carte-img { width: 92px; height: 92px; font-size: 2.2rem; border-radius: 16px; }
@media (max-width: 640px) { .carte-editoriale { flex-direction: column; } .carte-editoriale .carte-img { width: 58px; height: 58px; } }

/* Issues multiples inline */
.liste-issues { display: flex; flex-direction: column; gap: 3px; }
.ligne-issue { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 11px; }
.ligne-issue:hover { background: var(--surface-2); }
.ligne-issue .lib { flex: 1; font-size: 0.88rem; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ligne-issue .proba { font-weight: 800; width: 52px; text-align: right; }
.ligne-issue .btn-oui, .ligne-issue .btn-non { flex: 0 0 78px; padding: 6px 2px; min-height: 32px; }

/* ===================== Boutons et champs ===================== */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface-2); color: var(--text-1);
  border: none; border-radius: var(--r-bouton);
  padding: 9px 18px; font-weight: 700; font-size: 0.88rem;
  min-height: 40px;
  transition: transform 100ms, filter 120ms, background 120ms;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(0.98); }
.btn-principal { background: var(--grad-accent); color: #fff; box-shadow: var(--ombre-accent); }
.btn-principal:hover { filter: brightness(1.06); background: var(--grad-accent); }
.btn-discret { background: var(--surface-1); color: var(--text-2); box-shadow: inset 0 0 0 1.5px var(--border-fort); }
.btn-discret:hover { color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--surface-1); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-claim { background: var(--grad-eclats); color: #4a2e00; box-shadow: 0 6px 18px rgba(245, 165, 24, 0.4); font-weight: 800; }
.btn-claim:hover { filter: brightness(1.05); }
.btn-claim-fait { background: var(--surface-2); color: var(--text-3); cursor: default; font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--border); }

.champ {
  background: var(--surface-1); border: 1.5px solid var(--border-fort); color: var(--text-1);
  border-radius: 11px; padding: 10px 13px; width: 100%; transition: border-color 120ms;
}
.champ:focus { border-color: var(--accent); outline: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chip {
  border: none; background: var(--surface-1); box-shadow: inset 0 0 0 1.5px var(--border);
  border-radius: var(--r-pill); padding: 6px 14px; font-size: 0.8rem; font-weight: 600; color: var(--text-2);
  display: inline-flex; align-items: center; gap: 6px; min-height: 34px;
  transition: background 120ms, color 120ms, box-shadow 120ms;
}
.chip.actif { color: #fff; background: var(--grad-accent); box-shadow: var(--ombre-accent); }
.chip:not(.actif):hover { color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }

/* ===================== Fiche marché ===================== */

.fiche { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
@media (min-width: 1024px) { .fiche { grid-template-columns: minmax(0, 1fr) 384px; align-items: start; } }

.fil-ariane { font-size: 0.78rem; color: var(--text-3); font-weight: 600; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fiche-entete { display: flex; gap: 15px; align-items: flex-start; margin-top: 10px; }
.fiche-img { width: 66px; height: 66px; border-radius: 16px; object-fit: cover; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 1.9rem; flex-shrink: 0; box-shadow: var(--ombre-1); }
.fiche-titre { font-size: 1.3rem; font-weight: 800; line-height: 1.28; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.fiche-actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
.fiche-proba-bloc { display: flex; align-items: baseline; gap: 12px; margin: 14px 0 4px; flex-wrap: wrap; }
.fiche-proba { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.03em; }

.panneau {
  background: var(--surface-1); border-radius: var(--r-carte); padding: 16px 18px; margin-top: 16px;
  box-shadow: var(--ombre-1);
}
.panneau h3 { margin-top: 0; }
.panneau .prose { font-size: 0.9rem; color: var(--text-2); max-width: 75ch; white-space: pre-line; }

.stats-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 13px; padding: 11px 14px; }
.stat .val { font-weight: 800; font-size: 1.08rem; letter-spacing: -0.01em; }
.stat .lib { font-size: 0.72rem; color: var(--text-3); font-weight: 600; }

.graphique-conteneur { margin-top: 12px; }
.graphique-conteneur svg { width: 100%; height: auto; display: block; }
.graphique-plages { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.graphique-plages button {
  background: var(--surface-2); border: none; border-radius: var(--r-pill);
  color: var(--text-2); font-size: 0.76rem; font-weight: 600; padding: 5px 13px;
}
.graphique-plages button.actif { color: #fff; background: var(--accent); }

.carnet { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; font-size: 0.82rem; }
.carnet .col-titre { color: var(--text-3); font-size: 0.72rem; font-weight: 700; }
.carnet-ligne { display: flex; justify-content: space-between; padding: 4px 9px; border-radius: 7px; position: relative; overflow: hidden; font-weight: 600; }
.carnet-ligne .barre { position: absolute; top: 0; bottom: 0; right: 0; opacity: 0.16; }
.carnet-ligne.bid .barre { background: var(--yes); }
.carnet-ligne.ask .barre { background: var(--no); }

/* ===================== Ticket ===================== */

.ticket {
  background: var(--surface-1); border-radius: var(--r-carte); padding: 18px;
  position: sticky; top: 128px;
  display: flex; flex-direction: column; gap: 13px;
  box-shadow: var(--ombre-2);
}
.ticket-cotes { display: flex; gap: 10px; }
.cote {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 14px 6px; border-radius: 15px; border: 2px solid var(--border);
  background: var(--surface-1); transition: border-color 120ms, background 120ms, transform 100ms;
}
.cote:active { transform: scale(0.98); }
.cote-label { font-weight: 800; font-size: 0.78rem; letter-spacing: 0.5px; }
.cote-prix { font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; }
.cote-note { font-size: 0.72rem; color: var(--text-3); font-weight: 600; }
.cote-oui.actif { border-color: var(--yes); background: var(--yes-soft); color: var(--yes-fonce); }
.cote-non.actif { border-color: var(--no); background: var(--no-soft); color: var(--no-fonce); }
.cote-oui:not(.actif):hover { border-color: var(--yes); }
.cote-non:not(.actif):hover { border-color: var(--no); }
.cote.actif .cote-note { color: inherit; opacity: 0.85; }

.ticket-position {
  background: var(--accent-soft); border-radius: 14px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 7px;
}
.tp-ligne { display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
.tp-chiffres { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.8rem; color: var(--text-2); font-weight: 600; }
.ticket-actions-pos { display: flex; gap: 8px; margin-top: 2px; }
.ticket-actions-pos .btn { flex: 1; min-height: 36px; padding: 6px; }

.ticket-onglets { display: flex; gap: 8px; }
.ticket-onglets button { flex: 1; border-radius: var(--r-bouton); padding: 9px; font-weight: 700; background: var(--surface-2); border: none; color: var(--text-2); }
.raccourcis { display: flex; gap: 7px; }
.raccourcis button { flex: 1; background: var(--surface-2); border: none; border-radius: 10px; padding: 8px 2px; font-size: 0.82rem; font-weight: 700; color: var(--text-2); min-height: 36px; transition: background 120ms, color 120ms; }
.raccourcis button:hover { background: var(--accent-soft); color: var(--accent); }
.ticket-detail { font-size: 0.85rem; display: flex; flex-direction: column; gap: 5px; }
.ticket-detail div { display: flex; justify-content: space-between; }
.ticket-detail dt { color: var(--text-3); }
.ticket-detail dd { margin: 0; font-weight: 700; }
.ticket-note { font-size: 0.76rem; color: var(--text-3); }
.ticket-erreur { color: var(--no-fonce); font-size: 0.84rem; font-weight: 600; background: var(--no-soft); border-radius: 11px; padding: 9px 12px; }
.ticket-avert { color: var(--eclats-fonce); font-size: 0.84rem; font-weight: 600; background: var(--warning-soft); border-radius: 11px; padding: 9px 12px; }
.recu { background: var(--surface-2); border-radius: 13px; padding: 12px 14px; font-size: 0.85rem; }
.recu div { display: flex; justify-content: space-between; padding: 3px 0; gap: 12px; }

/* Bottom sheet mobile */
#voile { position: fixed; inset: 0; background: rgba(27, 23, 53, 0.42); z-index: 60; backdrop-filter: blur(2px); }
#feuille-basse {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;

@keyframes montee { from { transform: translateY(60%); } to { transform: none; } }
.barre-oui-non-mobile {

/* ===================== En jeu ===================== */

.enjeu-entete {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;

}

/* ===================== Claims / Résultats ===================== */

.carte-claim { box-shadow: var(--ombre-2); background: linear-gradient(140deg, var(--eclats-soft) 0%, var(--surface-1) 60%); }

.solde-flash { animation: soldeFlash 800ms ease; }

.particule {

/* ===================== Tableaux / registre ===================== */

.tableau { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.tableau th { text-align: left; color: var(--text-3); font-size: 0.72rem; font-weight: 700; padding: 8px 10px; border-bottom: 1.5px solid var(--border); }

.tableau td.num { text-align: right; font-weight: 600; }
.tableau tr:hover td { background: var(--surface-2); }
.defilement-x { overflow-x: auto; }

/* ===================== Paramètres ===================== */

.reglage { display: flex; gap: 16px; align-items: flex-start; padding: 14px 4px; border-bottom: 1px solid var(--border); }
.reglage-infos { flex: 1; min-width: 0; }
.reglage-libelle { font-weight: 700; font-size: 0.94rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.reglage-desc { font-size: 0.82rem; color: var(--text-2); max-width: 72ch; }
.reglage-impacts { font-size: 0.76rem; color: var(--text-3); margin-top: 5px; }
.reglage-ctrl { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex-shrink: 0; }
.reglage-ctrl .champ { width: 130px; text-align: right; }
.interrupteur { position: relative; width: 46px; height: 26px; appearance: none; background: var(--surface-3); border: none; border-radius: var(--r-pill); transition: background 160ms; cursor: pointer; }
.interrupteur:checked { background: var(--accent); }
.interrupteur::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--ombre-1); transition: transform 160ms; }
.interrupteur:checked::after { transform: translateX(20px); }

/* ===================== États vides / erreurs / skeletons ===================== */

.etat-vide {
  text-align: center; padding: 48px 22px; color: var(--text-2);
  background: var(--surface-1); border-radius: var(--r-carte); box-shadow: var(--ombre-1);
}
.etat-vide .ico { font-size: 2.4rem; display: block; margin-bottom: 10px; }

.etat-erreur { box-shadow: inset 0 0 0 1.5px var(--no); }
.id-support { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--text-3); }

.skeleton {
  background: linear-gradient(100deg, var(--surface-2) 40%, var(--surface-3) 50%, var(--surface-2) 60%);
  background-size: 300% 100%; animation: scintille 1.2s infinite linear;
  border-radius: 12px; color: transparent !important;
}
.skeleton * { visibility: hidden; }
@keyframes scintille { to { background-position: -300% 0; } }

.flash-vert { animation: flashVert 420ms ease; }
.flash-rouge { animation: flashRouge 420ms ease; }
@keyframes flashVert { 30% { color: var(--yes-fonce); } }
@keyframes flashRouge { 30% { color: var(--no-fonce); } }

<script type="module">

/* ================= js/config.js ================= */
const VALEUR_NOMINALE = 100;
const THEMES = [
  "Politique", "Géopolitique", "Société", "Justice", "Économie", "Entreprises", "Finance",
  "Technologie", "Intelligence artificielle", "Internet", "Sciences", "Espace", "Santé",
  "Climat et environnement", "Cinéma", "Télévision", "Musique", "Jeux vidéo", "Culture",
  "Sport", "Insolite"
];
const REGIONS = ["France", "Europe", "Monde"];
const ETAT_SOURCES_DEFAUT = {
  polymarket: { etat: "chargement", libelle: "Polymarket : connexion…" },
  manifold: { etat: "chargement", libelle: "Manifold : connexion…" },
  websocket: { etat: "catalogue", depuisS: 0 }
};


/* ================= js/api/normalize.js ================= */
// Normalisation pure des catalogues publics Polymarket et Manifold.
// Aucun de ces adaptateurs ne place d'ordre sur les plateformes sources.

const nombre = (valeur, defaut = 0) => {
  const n = Number(valeur);
  return Number.isFinite(n) ? n : defaut;
};

function tableau(valeur) {
  if (Array.isArray(valeur)) return valeur;
  if (typeof valeur !== "string") return [];
  try {
    const resultat = JSON.parse(valeur);
    return Array.isArray(resultat) ? resultat : [];
  } catch {
    return [];
  }
}

const identifiant = (valeur) => String(valeur ?? "")
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function themeDepuis(...valeurs) {
  const texte = valeurs.flat().filter(Boolean).join(" ").toLowerCase();
  const regles = [
    ["Sport", /sport|football|soccer|nba|nfl|mlb|nhl|tennis|world cup|league/],
    ["Politique", /politic|election|president|congress|government|minister|trump|senate|parliament/],
    ["Économie", /econom|inflation|fed|interest rate|gdp|recession|jobs|unemployment/],
    ["Finance", /bitcoin|crypto|ethereum|stock|market cap|price|dollar|euro|finance/],
    ["Intelligence artificielle", /\bai\b|artificial intelligence|openai|anthropic|model/],
    ["Climat et environnement", /climate|weather|temperature|warming|hurricane|environment/],
    ["Espace", /space|spacex|starship|mars|moon|nasa/],
    ["Cinéma", /movie|film|cinema|oscar|box office/],
    ["Technologie", /technology|tech|software|apple|google|microsoft/]
  ];
  return regles.find(([, motif]) => motif.test(texte))?.[0] || "Actualité";
}

function regionsDepuis(...valeurs) {
  const texte = valeurs.flat().filter(Boolean).join(" ").toLowerCase();
  if (/france|french|paris|macron/.test(texte)) return ["France"];
  if (/europe|eu\b|european|uk\b|britain|germany|italy|spain/.test(texte)) return ["Europe"];
  return ["Monde"];
}

function statut({ ferme, resolu, annule }) {
  if (annule) return "CANCELLED";
  if (resolu) return "RESOLVED";
  if (ferme) return "CLOSED";
  return "OPEN";
}

function issueBinaire(probabilite, variation24h, prefixe = "") {
  const p = Number.isFinite(probabilite) ? Math.min(1, Math.max(0, probabilite)) : null;
  const avant = p == null || !Number.isFinite(variation24h)
    ? null
    : Math.min(1, Math.max(0, p - variation24h));
  return [
    { id: `${prefixe}oui`, label: "OUI", prob: p, prev24h: avant, history: [] },
    { id: `${prefixe}non`, label: "NON", prob: p == null ? null : 1 - p, prev24h: avant == null ? null : 1 - avant, history: [] }
  ];
}

function normaliserMarchePolymarket(marche) {
  const libelles = tableau(marche.outcomes);
  const prix = tableau(marche.outcomePrices);
  const tokens = tableau(marche.clobTokenIds);
  return libelles.map((label, index) => ({
    id: String(label).toUpperCase() === "YES" ? "oui" : String(label).toUpperCase() === "NO" ? "non" : identifiant(label) || `issue-${index + 1}`,
    label: String(label).toUpperCase() === "YES" ? "OUI" : String(label).toUpperCase() === "NO" ? "NON" : String(label),
    prob: Number.isFinite(Number(prix[index])) ? Number(prix[index]) : null,
    prev24h: index === 0 && Number.isFinite(Number(marche.oneDayPriceChange))
      ? Math.min(1, Math.max(0, Number(prix[index]) - Number(marche.oneDayPriceChange)))
      : null,
    history: [],
    tokenId: tokens[index] ? String(tokens[index]) : null
  }));
}

function normaliserEvenementPolymarket(evenement, maintenant = Date.now()) {
  const marches = (evenement.markets || []).filter((m) => m && !m.archived);
  if (!marches.length) return null;
  const ouvert = marches.some((m) => m.active && !m.closed);
  const multi = marches.length > 1;
  let issues;
  if (multi) {
    issues = marches.map((m, index) => {
      const issuesMarche = normaliserMarchePolymarket(m);
      const oui = issuesMarche.find((i) => i.id === "oui") || issuesMarche[0];
      return {
        ...oui,
        id: `pm-${m.id || index + 1}`,
        label: m.groupItemTitle || m.question || `Issue ${index + 1}`,
        marketId: String(m.id || ""),
        conditionId: m.conditionId || null
      };
    }).filter((i) => i.prob != null);
  } else {
    issues = normaliserMarchePolymarket(marches[0]);
  }
  if (!issues.length) return null;
  const principal = marches[0];
  const ferme = !ouvert || Boolean(evenement.closed);
  const resolu = ferme && marches.every((m) => m.closed && tableau(m.outcomePrices).some((p) => Number(p) === 1));
  const tags = (evenement.tags || []).map((t) => t.label || t.name).filter(Boolean);
  const titre = evenement.title || principal.question;
  const description = evenement.description || principal.description || "";
  const etat = statut({ ferme, resolu, annule: false });
  const sourceDate = Date.parse(evenement.updatedAt || principal.updatedAt || evenement.creationDate || "");

  return {
    id: `pm-${evenement.id || principal.id}`,
    source: "POLYMARKET",
    externalId: String(evenement.id || principal.id),
    sourceUrl: `https://polymarket.com/event/${evenement.slug || principal.slug || evenement.id}`,
    titleOriginal: titre,
    marketType: multi ? "MULTIPLE" : "BINARY",
    status: etat,
    tradable: etat === "OPEN" && issues.every((i) => i.prob != null) && marches.some((m) => m.enableOrderBook !== false),
    nonTradableReason: etat === "OPEN" ? "Prix ou carnet public indisponible." : "Marché fermé sur Polymarket.",
    theme: themeDepuis(evenement.category, tags, titre),
    regions: regionsDepuis(tags, titre, description),
    imageUrl: evenement.image || evenement.icon || principal.image || principal.icon || null,
    closeAt: evenement.endDate || principal.endDate || null,
    expectedResolutionAt: evenement.endDate || principal.endDate || null,
    resolutionTimeConfidence: "EXPECTED",
    volume: nombre(evenement.volume, marches.reduce((s, m) => s + nombre(m.volume), 0)),
    volume24h: nombre(evenement.volume24hr, marches.reduce((s, m) => s + nombre(m.volume24hr), 0)),
    liquidity: nombre(evenement.liquidity, marches.reduce((s, m) => s + nombre(m.liquidity), 0)),
    bettorCount: null,
    resolutionSource: evenement.resolutionSource || principal.resolutionSource || "Règles publiées par Polymarket",
    descriptionOriginal: description,
    fraicheurS: Number.isFinite(sourceDate) ? Math.max(0, Math.round((maintenant - sourceDate) / 1000)) : 0,
    spread: nombre(principal.spread, 0.02),
    issues,
    polymarketMarkets: marches.map((m) => ({
      id: String(m.id || ""),
      conditionId: m.conditionId || null,
      tokenIds: tableau(m.clobTokenIds).map(String)
    }))
  };
}

function normaliserCataloguePolymarket(evenements, maintenant = Date.now()) {
  return (Array.isArray(evenements) ? evenements : [])
    .map((e) => normaliserEvenementPolymarket(e, maintenant))
    .filter(Boolean);
}

function normaliserMarcheManifold(marche, maintenant = Date.now()) {
  if (!marche?.id || !marche.question) return null;
  const ferme = Boolean(marche.isResolved) || (marche.closeTime && marche.closeTime <= maintenant);
  const annule = marche.isResolved && ["CANCEL", "MKT"].includes(marche.resolution);
  const etat = statut({ ferme, resolu: Boolean(marche.isResolved) && !annule, annule });
  const type = marche.outcomeType || "OTHER";
  let issues;
  if (type === "BINARY") {
    issues = issueBinaire(nombre(marche.probability, NaN), nombre(marche.probChangeDay, NaN));
  } else if (type === "MULTIPLE_CHOICE" && Array.isArray(marche.answers)) {
    issues = marche.answers.filter((a) => !a.isOther).map((a, index) => ({
      id: String(a.id || `reponse-${index + 1}`),
      label: a.text || a.answer || `Réponse ${index + 1}`,
      prob: Number.isFinite(Number(a.probability)) ? Number(a.probability) : null,
      prev24h: null,
      history: []
    }));
  } else {
    issues = issueBinaire(nombre(marche.probability, NaN), nombre(marche.probChangeDay, NaN));
  }
  const tradableType = type === "BINARY" || type === "MULTIPLE_CHOICE";
  const titre = marche.question;
  const description = marche.textDescription || marche.description || "";
  return {
    id: `mf-${marche.id}`,
    source: "MANIFOLD",
    externalId: String(marche.id),
    sourceUrl: marche.url || `https://manifold.markets/${marche.creatorUsername || "market"}/${marche.slug || marche.id}`,
    titleOriginal: titre,
    marketType: type === "BINARY" ? "BINARY" : type === "MULTIPLE_CHOICE" ? "MULTIPLE_CHOICE" : "OTHER",
    sousType: tradableType ? null : type,
    status: etat,
    tradable: etat === "OPEN" && tradableType && issues.some((i) => i.prob != null),
    nonTradableReason: tradableType ? (etat === "OPEN" ? "Probabilité publique indisponible." : "Marché fermé sur Manifold.") : `Format ${type} consultable, non pris en charge pour le trading.`,
    sommeEgale1: Boolean(marche.shouldAnswersSumToOne),
    theme: themeDepuis(marche.tags, titre, description),
    regions: regionsDepuis(marche.tags, titre, description),
    imageUrl: marche.coverImageUrl || marche.creatorAvatarUrl || null,
    closeAt: marche.closeTime ? new Date(marche.closeTime).toISOString() : null,
    expectedResolutionAt: marche.closeTime ? new Date(marche.closeTime).toISOString() : null,
    resolutionTimeConfidence: "EXPECTED",
    volume: nombre(marche.volume),
    volume24h: nombre(marche.volume24Hours),
    liquidity: nombre(marche.totalLiquidity),
    bettorCount: nombre(marche.uniqueBettorCount, null),
    createur: marche.creatorUsername || marche.creatorName || null,
    resolutionSource: marche.resolutionSource || "Résolution publiée par le créateur Manifold",
    descriptionOriginal: description,
    fraicheurS: marche.lastUpdatedTime ? Math.max(0, Math.round((maintenant - marche.lastUpdatedTime) / 1000)) : 0,
    spread: 0.02,
    prixMiroir: true,
    issues
  };
}

function normaliserCatalogueManifold(marches, maintenant = Date.now()) {
  return (Array.isArray(marches) ? marches : [])
    .map((m) => normaliserMarcheManifold(m, maintenant))
    .filter(Boolean);
}

  try {
    const reponse = await fetch(url, {
      signal: controleur.signal,
      headers: { Accept: "application/json" },
      cache: "no-store"
    });
    if (!reponse.ok) throw new Error(`HTTP ${reponse.status}`);

  } finally {

  }

async function chargerPolymarket() {

}

async function chargerManifold() {

  return normaliserCatalogueManifold(marches)
    .filter((m) => m.status === "OPEN")
    .sort((a, b) => (b.volume24h || 0) - (a.volume24h || 0) || (b.volume || 0) - (a.volume || 0))

function marcheDepuisSupabase(ligne) {

      }))

async function chargerCatalogueSupabase() {
  const lignes = await rest("mk_markets", {
    select: "*,mk_outcomes(*)",
    status: "eq.OPEN",
    unavailable_at: "is.null",
    order: "volume_24h.desc",
    limit: "300"
  });
  return (lignes || []).map(marcheDepuisSupabase).filter((m) => m.issues.length);
}

function lireCache() {
  try {
    const cache = JSON.parse(localStorage.getItem(CLE_CACHE));
    if (!cache || !Array.isArray(cache.marches) || !cache.marches.length) return null;
    return { ...cache, perime: Date.now() - cache.enregistreAt > DUREE_CACHE_MS };
  } catch {
    return null;
  }
}

function sauverCache(marches) {
  try {
    localStorage.setItem(CLE_CACHE, JSON.stringify({ enregistreAt: Date.now(), marches }));
  } catch {
    // Un catalogue trop volumineux ne doit jamais empêcher l'application de fonctionner.
  }
}

async function chargerCatalogueReel() {
  const cache = lireCache();
  try {
    const marchesSupabase = await chargerCatalogueSupabase();
    if (marchesSupabase.length) {
      sauverCache(marchesSupabase);
      const polyCount = marchesSupabase.filter((m) => m.source === "POLYMARKET").length;
      const manifoldCount = marchesSupabase.length - polyCount;
      return {
        marches: marchesSupabase,
        origine: "supabase",
        cachePerime: false,
        sources: {
          polymarket: { ok: polyCount > 0, count: polyCount, erreur: polyCount ? null : "aucun marché synchronisé" },
          manifold: { ok: manifoldCount > 0, count: manifoldCount, erreur: manifoldCount ? null : "aucun marché synchronisé" }
        }
      };
    }
  } catch {
    // Repli temporaire vers les API publiques ou le dernier cache réel.
  }
  const resultats = await Promise.allSettled([chargerPolymarket(), chargerManifold()]);
  const [poly, manifold] = resultats;
  const marches = [
    ...(poly.status === "fulfilled" ? poly.value : []),
    ...(manifold.status === "fulfilled" ? manifold.value : [])
  ];
  if (marches.length) sauverCache(marches);
  return {
    marches: marches.length ? marches : (cache?.marches || []),
    origine: marches.length ? "reseau" : cache ? "cache" : "aucune",
    cachePerime: !marches.length && Boolean(cache?.perime),
    sources: {
      polymarket: poly.status === "fulfilled"
        ? { ok: true, count: poly.value.length }
        : { ok: false, erreur: poly.reason?.message || "indisponible" },
      manifold: manifold.status === "fulfilled"
        ? { ok: true, count: manifold.value.length }
        : { ok: false, erreur: manifold.reason?.message || "indisponible" }
    }
  };
}

const CLOB = "https://clob.polymarket.com";
const MANIFOLD = "https://api.manifold.markets/v0";

async function lireJson(url, delaiMs = 10000) {
  const controleur = new AbortController();
  const minuterie = setTimeout(() => controleur.abort(), delaiMs);
  try {
    const reponse = await fetch(url, {
      signal: controleur.signal,
      headers: { Accept: "application/json" },
      cache: "no-store"
    });
    if (!reponse.ok) throw new Error(`HTTP ${reponse.status}`);
    return await reponse.json();
  } finally {
    clearTimeout(minuterie);
  }
}

const lignesCarnet = (lignes) => (Array.isArray(lignes) ? lignes : [])
  .map((ligne) => [Number(ligne.price ?? ligne[0]), Number(ligne.size ?? ligne[1])])
  .filter(([prix, taille]) => Number.isFinite(prix) && Number.isFinite(taille));

function appliquerComplementBinaire(marche, issueModifiee) {
  if (marche.marketType !== "BINARY" || issueModifiee.prob == null) return;
  const autre = marche.issues.find((i) => i.id !== issueModifiee.id);
  if (autre) autre.prob = 1 - issueModifiee.prob;
}

async function enrichirPolymarket(marche, issueId) {
  const issue = marche.issues.find((i) => i.id === issueId && i.tokenId)
    || marche.issues.find((i) => i.tokenId);
  if (!issue?.tokenId) throw new Error("Identifiant CLOB absent");
  const token = encodeURIComponent(issue.tokenId);
  const [carnetResultat, historiqueResultat, milieuResultat] = await Promise.allSettled([
    lireJson(`${CLOB}/book?token_id=${token}`),
    lireJson(`${CLOB}/prices-history?market=${token}&interval=max&fidelity=60`),
    lireJson(`${CLOB}/midpoint?token_id=${token}`)
  ]);

  if (carnetResultat.status === "fulfilled") {
    const brut = carnetResultat.value;
    const bids = lignesCarnet(brut.bids).sort((a, b) => b[0] - a[0]).slice(0, 12);
    const asks = lignesCarnet(brut.asks).sort((a, b) => a[0] - b[0]).slice(0, 12);
    marche.carnet = { bids, asks, tokenId: issue.tokenId };
    if (bids.length && asks.length) marche.spread = Math.max(0, asks[0][0] - bids[0][0]);
    marche.profondeurFaible = bids.length + asks.length < 4;
  }
  if (historiqueResultat.status === "fulfilled") {
    issue.history = (historiqueResultat.value.history || [])
      .map((point) => ({ t: Number(point.t) * 1000, p: Number(point.p) }))
      .filter((point) => Number.isFinite(point.t) && Number.isFinite(point.p));
    if (issue.history.length) {
      const cible = Date.now() - 24 * 3600e3;
      issue.prev24h = issue.history.reduce((a, b) =>
        Math.abs(b.t - cible) < Math.abs(a.t - cible) ? b : a).p;
    }
  }
  if (milieuResultat.status === "fulfilled" && Number.isFinite(Number(milieuResultat.value.mid))) {
    issue.prob = Number(milieuResultat.value.mid);
    appliquerComplementBinaire(marche, issue);
  }
  marche.fraicheurS = 0;
  marche.detailEtat = "ok";
  return marche;
}

async function enrichirManifold(marche) {
  const detail = await lireJson(`${MANIFOLD}/market/${encodeURIComponent(marche.externalId)}`);
  const normalise = normaliserMarcheManifold(detail);
  if (!normalise) throw new Error("Réponse Manifold invalide");
  const historiques = new Map(marche.issues.map((i) => [i.id, i.history]));
  Object.assign(marche, normalise);
  marche.issues.forEach((issue) => { issue.history = historiques.get(issue.id) || issue.history || []; });
  marche.detailEtat = "ok";
  marche.fraicheurS = 0;
  return marche;
}

async function enrichirMarche(marche, issueId) {
  marche.detailEtat = "chargement";
  try {
    return marche.source === "POLYMARKET"
      ? await enrichirPolymarket(marche, issueId)
      : await enrichirManifold(marche);
  } catch (erreur) {
    marche.detailEtat = "erreur";
    marche.detailErreur = erreur?.message || "Détail indisponible";
    throw erreur;
  }
}

let socketActif = null;
let marcheSuivi = null;
let minuterieReconnexion = null;

function fermerSuivi() {
  clearTimeout(minuterieReconnexion);
  minuterieReconnexion = null;
  const socket = socketActif;
  socketActif = null;
  marcheSuivi = null;
  if (socket && socket.readyState < 2) socket.close();
}

function prixDepuisMessage(message) {
  const valeur = message.price ?? message.mid ?? message.best_bid ?? message.last_trade_price;
  const prix = Number(valeur);
  return Number.isFinite(prix) ? prix : null;
}

function appliquerMessagePolymarket(marche, message) {
  const messages = Array.isArray(message) ? message : [message];
  let change = false;
  for (const evenement of messages) {
    if (evenement?.bids || evenement?.asks) {
      const issue = marche.issues.find((i) => i.tokenId === String(evenement.asset_id));
      if (issue) {
        const bids = lignesCarnet(evenement.bids).sort((a, b) => b[0] - a[0]).slice(0, 12);
        const asks = lignesCarnet(evenement.asks).sort((a, b) => a[0] - b[0]).slice(0, 12);
        marche.carnet = { bids, asks, tokenId: issue.tokenId };
        if (bids.length && asks.length) {
          issue.prob = (bids[0][0] + asks[0][0]) / 2;
          marche.spread = asks[0][0] - bids[0][0];
          appliquerComplementBinaire(marche, issue);
        }
        change = true;
      }
    }
    const changements = evenement?.price_changes || [evenement];
    for (const changement of changements) {
      const issue = marche.issues.find((i) => i.tokenId === String(changement?.asset_id));
      const prix = prixDepuisMessage(changement || {});
      if (issue && prix != null) {
        issue.prob = prix;
        appliquerComplementBinaire(marche, issue);
        change = true;
      }
    }
  }
  return change;
}

function trouverContratManifold(message) {
  const candidats = [message?.data, message?.contract, message?.data?.contract, message];
  return candidats.find((x) => x && typeof x === "object" && x.id && Number.isFinite(Number(x.probability)));
}

function suivreTempsReel(marche, surMiseAJour) {
  if (!marche || marche.status !== "OPEN") {
    fermerSuivi();
    return;
  }
  if (marcheSuivi === marche.id && socketActif) return;
  fermerSuivi();
  marcheSuivi = marche.id;
  const identifiant = marche.id;
  const url = marche.source === "POLYMARKET"
    ? "wss://ws-subscriptions-clob.polymarket.com/ws/market"
    : "wss://api.manifold.markets/ws";

  const connecter = () => {
    if (marcheSuivi !== identifiant) return;
    const socket = new WebSocket(url);
    socketActif = socket;
    socket.onopen = () => {
      if (marche.source === "POLYMARKET") {
        const tokens = marche.issues.map((i) => i.tokenId).filter(Boolean);
        if (tokens.length) socket.send(JSON.stringify({ assets_ids: tokens, type: "market" }));
      } else {
        socket.send(JSON.stringify({
          type: "subscribe",
          txid: Date.now(),
          topics: [`contract/${marche.externalId}`]
        }));
      }
    };
    socket.onmessage = (evenement) => {
      try {
        const message = JSON.parse(evenement.data);
        let change = false;
        if (marche.source === "POLYMARKET") {
          change = appliquerMessagePolymarket(marche, message);
        } else {
          const contrat = trouverContratManifold(message);
          if (contrat?.id === marche.externalId) {
            const oui = marche.issues.find((i) => i.id === "oui");
            if (oui) {
              oui.prob = Number(contrat.probability);
              appliquerComplementBinaire(marche, oui);
              change = true;
            }
          }
        }
        if (change) {
          marche.fraicheurS = 0;
          surMiseAJour?.();
        }
      } catch {
        // Les messages de contrôle non JSON utile sont ignorés.
      }
    };
    socket.onclose = () => {
      if (socketActif === socket) socketActif = null;
      if (marcheSuivi === identifiant) minuterieReconnexion = setTimeout(connecter, 3000);
    };
  };
  connecter();
}

    body: JSON.stringify({ email, password })
  });
  const donnees = await reponse.json();
  if (!reponse.ok) throw new Error(donnees.error_description || donnees.msg || "Connexion refusée.");
  sauverSession(donnees);
  return donnees.user;
}

function deconnexion() { sauverSession(null); }

async function rafraichir() {
  if (!session?.refresh_token) return false;
  const reponse = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: session.refresh_token })
  });
  if (!reponse.ok) { sauverSession(null); return false; }
  sauverSession(await reponse.json());
  return true;
}

async function appel(path, options = {}, dejaRetente = false) {
  const headers = {
    apikey: SUPABASE_KEY,
    "Content-Type": "application/json",
    ...(options.headers || {})
  };
  if (session?.access_token) headers.Authorization = `Bearer ${session.access_token}`;
  const reponse = await fetch(`${SUPABASE_URL}${path}`, { ...options, headers });
  if (reponse.status === 401 && !dejaRetente && await rafraichir()) {
    return appel(path, options, true);
  }
  const texte = await reponse.text();
  if (!reponse.ok) {
    let message = `Erreur ${reponse.status}`;
    try {
      const erreur = JSON.parse(texte);
      message = erreur.message || erreur.error_description || erreur.hint || message;
    } catch { /* réponse non JSON */ }
    throw new Error(message);
  }
  return texte ? JSON.parse(texte) : null;
}

function rpc(nom, args = {}) {
  return appel(`/rest/v1/rpc/${nom}`, { method: "POST", body: JSON.stringify(args) });
}

function rest(table, params = {}) {
  const query = new URLSearchParams(params).toString();
  return appel(`/rest/v1/${table}${query ? `?${query}` : ""}`);
}

function nombrePortefeuille(valeur) {
  const resultat = Number(valeur);
  return Number.isFinite(resultat) ? resultat : 0;
}

function positionDepuis(ligne) {
  return {
    id: ligne.id,
    marcheId: `${ligne.source === "POLYMARKET" ? "pm" : "mf"}-${ligne.market_external_id}`,
    issueId: ligne.outcome_external_id,
    issueLabel: ligne.outcome_label,
    parts: nombrePortefeuille(ligne.shares),
    valeurNominale: 100,
    prixMoyen: nombrePortefeuille(ligne.average_price),
    probEntree: nombrePortefeuille(ligne.average_price) / 100,
    montantEngage: nombrePortefeuille(ligne.cost_basis),
    montantExpose: nombrePortefeuille(ligne.cost_basis),
    achatAt: ligne.opened_at,
    lots: [{
      id: ligne.id,
      parts: nombrePortefeuille(ligne.shares),
      prixUnitaire: nombrePortefeuille(ligne.average_price),
      valeurNominale: 100,
      date: ligne.opened_at
    }],
    chronologie: []
  };
}

async function chargerPortefeuille() {
  if (!estConnecte()) return { connecte: false, utilisateur: null, solde: null, positions: [], ledger: [] };
  const [solde, positions, ledger] = await Promise.all([
    rpc("eclats_balance"),
    rest("mk_user_positions", { select: "*", order: "updated_at.desc" }),
    rest("eclats_ledger", {
      select: "id,amount,source,app_id,kind,reason,reference_id,occurred_at,created_at,metadata",
      order: "created_at.desc",
      limit: "100"
    })
  ]);
  return {
    connecte: true,
    utilisateur: utilisateur(),
    solde: nombrePortefeuille(solde),
    positions: (positions || []).map(positionDepuis),
    ledger: (ledger || []).map((ligne) => {
      const sourceMarche = ligne.metadata?.source;
      const idExterne = ligne.metadata?.market_external_id;
      return {
        id: ligne.id,
        t: ligne.occurred_at || ligne.created_at,
        montant: nombrePortefeuille(ligne.amount),
        source: ligne.source,
        application: ligne.app_id,
        marcheId: sourceMarche && idExterne
          ? `${sourceMarche === "POLYMARKET" ? "pm" : "mf"}-${idExterne}`
          : null,
        libelle: ligne.reason || ligne.source
      };
    })
  };
}

async function acheter({ marche, issueId, montant, idempotencyKey }) {
  return rpc("mk_buy", {
    p_source: marche.source,
    p_market_external_id: String(marche.externalId),
    p_outcome_external_id: String(issueId),
    p_amount: montant,
    p_idempotency_key: idempotencyKey
  });
}

async function vendre({ positionId, parts, idempotencyKey }) {
  return rpc("mk_sell", {
    p_position_id: positionId,
    p_shares: parts,
    p_idempotency_key: idempotencyKey
  });
}

function marche(id) { return etat.marches.find((m) => m.id === id); }

async function chargerDetailMarche(id, issueId) {

  if (!cible || cible.detailEtat === "ok" || etat.enrichissementsEnCours.has(id)) return false;
  etat.enrichissementsEnCours.add(id);
  try { await enrichirMarche(cible, issueId); }
  catch { /* le catalogue reste consultable */ }
  finally { etat.enrichissementsEnCours.delete(id); notifier(); }
  return true;
}

async function chargerDonneesReelles() {
  etat.chargementCatalogue = true;
  notifier();
  const resultat = await chargerCatalogueReel();
  etat.marches = resultat.marches;
  etat.modeDonnees = resultat.origine;
  etat.catalogueActualiseAt = resultat.marches.length ? new Date().toISOString() : null;
  for (const source of ["polymarket", "manifold"]) {
    const info = resultat.sources[source];
    const nom = source === "polymarket" ? "Polymarket" : "Manifold";
    etat.sources[source] = info.ok
      ? { etat: "ok", libelle: `${nom} : ${info.count} marchés réels chargés` }
      : { etat: "panne", libelle: `${nom} : API indisponible (${info.erreur})` };
  }
  etat.sources.websocket = { etat: "catalogue", depuisS: 0 };
  etat.chargementCatalogue = false;
  notifier();
  return resultat;
}

async function chargerCompteReel() {
  etat.chargementCompte = true;
  etat.erreurCompte = null;
  notifier();
  try {
    const portefeuille = await chargerPortefeuille();
    etat.compteConnecte = portefeuille.connecte;
    etat.compteUtilisateur = portefeuille.utilisateur;
    etat.solde = portefeuille.solde;
    etat.positions = portefeuille.positions;
    etat.ledger = portefeuille.ledger;
  } catch (erreur) {
    etat.erreurCompte = erreur.message;
    etat.solde = null;
    etat.positions = [];
    etat.ledger = [];
  } finally {
    etat.chargementCompte = false;
    notifier();
  }
}

async function executerOrdre({ marche: marcheCible, issueId, mode, montant, parts, idempotencyKey }) {
  if (!etat.compteConnecte) throw new Error("Connectez-vous au portefeuille Éclats.");
  const resultat = mode === "vente"
    ? await vendre({
      positionId: etat.positions.find((p) => p.marcheId === marcheCible.id)?.id,
      parts,
      idempotencyKey
    })
    : await acheter({ marche: marcheCible, issueId, montant, idempotencyKey });
  await chargerCompteReel();
  return resultat;
}

// Aides de rendu partagées (formats, badges, cartes, graphiques SVG).
// Tous les rendus retournent des chaînes HTML ; les interactions passent par la
// délégation d'événements de app.js (data-action, data-fav, data-aller).
const echap = (s) => String(s ?? "")
  .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;");

const nf2 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });

const fmt = (n) => nf2.format(n);
const fmtEclats = (n) => `${nf2.format(n)} Éclats`;
const fmtSigne = (n) => `${n >= 0 ? "+" : ""}${nf2.format(n)}`;

function fmtCompact(n) {
  if (n == null) return "?";
  if (n >= 1e6) return `${nf2.format(Math.round(n / 1e5) / 10)} M`;
  if (n >= 1e3) return `${nf0.format(Math.round(n / 1e3))} K`;
  return nf0.format(n);
}

const pct = (p) => p == null ? "?" : `${Math.round(p * 100)}%`;
const prix = (p) => p == null ? "?" : nf2.format(p * etat.valeurNominale);

function fraicheur(m) {
  if (m.status !== "OPEN") return "";
  const s = m.fraicheurS ?? 0;
  if (m.donneesRetardees || s > 120) {
    const lib = s > 3600 ? `${Math.round(s / 3600)} h` : `${Math.round(s / 60)} min`;
    return `<span class="pastille pastille-warn">Retardé · ${lib}</span>`;
  }
  if (s <= 15) return `<span class="pastille pastille-ok">En direct</span>`;
  return `<span class="pastille pastille-off">Actualisé il y a ${s} s</span>`;
}

function tempsRestant(iso, prefixe = "") {
  if (!iso) return "échéance inconnue";
  const ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) return "échéance passée";
  const h = ms / 3600e3;
  let lib;
  if (h < 1) lib = `${Math.max(1, Math.round(ms / 60e3))} min`;
  else if (h < 48) lib = `${Math.round(h)} h`;
  else if (h < 24 * 60) lib = `${Math.round(h / 24)} j`;
  else lib = `${Math.round(h / 24 / 30)} mois`;
  return `${prefixe}${lib}`;
}

function compteReboursCourt(iso) {
  const ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) return "00:00:00";
  const s = Math.floor(ms / 1000);
  const hh = String(Math.floor(s / 3600)).padStart(2, "0");
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const ss = String(s % 60).padStart(2, "0");
  return `${hh}:${mm}:${ss}`;
}

function libelleEcheance(m) {
  if (m.status === "RESOLVED" || m.status === "CANCELLED") return "terminé";
  if (m.status === "CLOSED") return "Fermé · résolution en attente";
  if (m.expectedResolutionAt && m.resolutionTimeConfidence !== "UNKNOWN") {
    const conf = m.resolutionTimeConfidence === "EXACT" ? "" : "≈ ";
    return `résolution ${conf}${tempsRestant(m.expectedResolutionAt, "dans ")}`;
  }
  if (m.closeAt) return `clôture ${tempsRestant(m.closeAt, "dans ")}`;
  return "échéance inconnue";
}

const badgeSource = (source) =>
  `<span class="badge-source ${source.toLowerCase()}">${source === "POLYMARKET" ? "Polymarket" : "Manifold"}</span>`;

function pastilleStatut(m) {
  if (etat.sources[m.source.toLowerCase()]?.etat !== "ok") return `<span class="pastille pastille-no">Source indisponible</span>`;
  switch (m.status) {
    case "OPEN": return m.tradable
      ? `<span class="pastille pastille-ok">Ouvert</span>`
      : `<span class="pastille pastille-warn">Consultable · trading non pris en charge</span>`;
    case "CLOSED": return `<span class="pastille pastille-warn">Fermé · résolution en attente</span>`;
    case "RESOLVED": return `<span class="pastille">Résolu</span>`;
    case "CANCELLED": return `<span class="pastille pastille-no">Annulé</span>`;
    default: return `<span class="pastille pastille-no">Indisponible</span>`;
  }
}

function etoile(m) {
  const actif = etat.favoris.has(m.id);
  return `<button class="carte-etoile ${actif ? "actif" : ""}" data-fav="${m.id}"
    title="${actif ? "Retirer des favoris" : "Ajouter aux favoris"}" aria-pressed="${actif}">${actif ? "★" : "☆"}</button>`;
}

function imgMarche(m, classe = "carte-img") {
  if (!m.imageUrl) return `<span class="${classe}" aria-hidden="true">◈</span>`;
  return `<img class="${classe}" src="${echap(m.imageUrl)}" alt=""
    onerror="this.outerHTML='<span class=&quot;${classe}&quot;>◈</span>'">`;
}

function issuePrincipale(m) {
  return m.issues.find((i) => i.id === "oui") || m.issues[0];
}

function htmlVariation(issue) {
  if (issue?.prob == null || issue.prev24h == null) return `<span class="variation flat">?</span>`;
  const d = (issue.prob - issue.prev24h) * 100;
  const cls = d > 0.2 ? "up" : d < -0.2 ? "down" : "flat";
  const fleche = d > 0.2 ? "▲" : d < -0.2 ? "▼" : "·";
  return `<span class="variation ${cls}">${fleche} ${nf2.format(Math.abs(d))} pts (24 h)</span>`;
}

// ------- Graphiques SVG -------

function sparkline(history, { w = 150, h = 34, depuis = null, ligne = null } = {}) {
  if (!history || history.length < 2) return `<span class="tres-muet">pas de données</span>`;
  let pts = depuis ? history.filter((p) => p.t >= depuis) : history;
  if (pts.length < 2) pts = history.slice(-2);
  const min = Math.min(...pts.map((p) => p.p)), max = Math.max(...pts.map((p) => p.p));
  const amp = Math.max(0.02, max - min);
  const x = (i) => (i / (pts.length - 1)) * w;
  const y = (p) => h - 3 - ((p - min) / amp) * (h - 6);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.p).toFixed(1)}`).join(" ");
  const monte = pts.at(-1).p >= pts[0].p;
  const coul = monte ? "var(--yes)" : "var(--no)";
  const refLigne = ligne != null && ligne >= min && ligne <= max
    ? `<line x1="0" x2="${w}" y1="${y(ligne).toFixed(1)}" y2="${y(ligne).toFixed(1)}" stroke="var(--text-3)" stroke-dasharray="3 3" stroke-width="1"/>` : "";
  return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    ${refLigne}<path d="${d}" fill="none" stroke="${coul}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}

function grapheDetaille(history, { h = 220, marqueurs = [], ligneEntree = null, plageH = null } = {}) {
  if (!history || history.length < 2) {
    return `<div class="etat-vide"><span class="ico">📈</span>Pas encore assez de données de prix pour tracer une courbe.</div>`;
  }
  const w = 720;
  let pts = plageH ? history.filter((p) => p.t >= Date.now() - plageH * 3600e3) : history;
  if (pts.length < 2) pts = history.slice(-Math.min(12, history.length));
  const min = Math.max(0, Math.min(...pts.map((p) => p.p)) - 0.04);
  const max = Math.min(1, Math.max(...pts.map((p) => p.p)) + 0.04);
  const amp = Math.max(0.05, max - min);
  const x = (t) => ((t - pts[0].t) / Math.max(1, pts.at(-1).t - pts[0].t)) * (w - 46) + 40;
  const y = (p) => h - 22 - ((p - min) / amp) * (h - 40);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(p.p).toFixed(1)}`).join(" ");
  const grille = [0.25, 0.5, 0.75].filter((g) => g > min && g < max).map((g) =>
    `<line x1="40" x2="${w - 6}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
     <text x="4" y="${(y(g) + 4).toFixed(1)}" fill="var(--text-3)" font-size="11">${Math.round(g * 100)}%</text>`).join("");
  const entree = ligneEntree != null && ligneEntree > min && ligneEntree < max
    ? `<line x1="40" x2="${w - 6}" y1="${y(ligneEntree).toFixed(1)}" y2="${y(ligneEntree).toFixed(1)}"
        stroke="var(--accent)" stroke-dasharray="5 4" stroke-width="1.4"/>
       <text x="${w - 8}" y="${(y(ligneEntree) - 5).toFixed(1)}" fill="var(--accent)" font-size="11" text-anchor="end">prix moyen d'entrée</text>` : "";
  const marks = marqueurs.filter((mk) => mk.t >= pts[0].t && mk.t <= pts.at(-1).t).map((mk) => {
    const proche = pts.reduce((a, b) => Math.abs(b.t - mk.t) < Math.abs(a.t - mk.t) ? b : a);
    const coul = mk.type === "vente" ? "var(--no)" : mk.type === "achat" ? "var(--yes)" : "var(--info)";
    return `<circle cx="${x(mk.t).toFixed(1)}" cy="${y(proche.p).toFixed(1)}" r="4.5" fill="${coul}" stroke="var(--bg)" stroke-width="1.5">
      <title>${echap(mk.titre)}</title></circle>`;
  }).join("");
  const dernier = pts.at(-1);
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Courbe de probabilité">
    ${grille}
    <path d="${d} L${x(dernier.t).toFixed(1)},${h - 20} L40,${h - 20} Z" fill="var(--accent-fond)" stroke="none"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${entree}${marks}
    <circle cx="${x(dernier.t).toFixed(1)}" cy="${y(dernier.p).toFixed(1)}" r="3.5" fill="var(--accent)"/>
  </svg>`;
}

    <div class="liste-issues">
      ${issues.map((i) => `<div class="ligne-issue">
          <span class="lib" title="${echap(i.label)}">${echap(i.label)}</span>
          <span class="proba">${pct(i.prob)}</span>
          ${m.tradable ? `<button class="btn-oui" data-action="ticket" data-marche="${m.id}" data-issue="${i.id}">Acheter</button>` : ""}
        </div>`).join("")}
      ${reste > 0 ? `<a class="tres-muet" href="#/marche/${m.id}">+ ${reste} autres issues…</a>` : ""}
    </div>
  </div>`;
}

function skeletons(n = 6, type = "carte") {
  const bloc = type === "carte"
    ? `<div class="carte skeleton" style="height:170px"></div>`
    : `<div class="ligne-compacte skeleton" style="height:52px"></div>`;
  return Array(n).fill(bloc).join("");
}

function etatVide(ico, titre, texte = "", action = "") {
  return `<div class="etat-vide"><span class="ico">${ico}</span>
    <strong>${echap(titre)}</strong>
    ${texte ? `<p class="muet">${texte}</p>` : ""}${action}</div>`;
}

// ------- Calculs de position (affichage seulement, la vraie compta sera côté serveur) -------

function probIssue(m, issueId) {
  const i = m.issues.find((x) => x.id === issueId);
  return i ? i.prob : null;
}

function prixLiquidation(pos) {
  const m = marche(pos.marcheId);
  if (!m) return null;
  let p = probIssue(m, pos.issueId);
  if (p == null) return null;
  if (m.source === "MANIFOLD" && m.status === "OPEN") p = Math.max(0.01, p - 0.01); // spread miroir côté vente
  return p * pos.valeurNominale;
}

function valeurPosition(pos) {
  const pu = prixLiquidation(pos);
  return pu == null ? null : pu * pos.parts;
}

function plLatent(pos) {
  const v = valeurPosition(pos);
  if (v == null) return null;
  return v - pos.montantExpose;
}

function paiementPotentiel(pos) {
  // Les lots représentent les parts restantes après ventes partielles.
  return pos.lots.reduce((s, l) => s + l.parts * l.valeurNominale, 0);
}

function historiqueIssue(pos) {
  const m = marche(pos.marcheId);
  if (!m) return [];
  const i = m.issues.find((x) => x.id === pos.issueId);
  return i?.history || [];
}

// Routeur par hash : #/page/param?query
const routes = new Map();

function enregistrer(nom, rendu) { routes.set(nom, rendu); }

function routeCourante() {
  const brut = location.hash.replace(/^#\/?/, "") || "accueil";
  const [chemin, query = ""] = brut.split("?");
  const segments = chemin.split("/").filter(Boolean);
  return {
    page: segments[0] || "accueil",
    params: segments.slice(1),
    query: Object.fromEntries(new URLSearchParams(query))
  };
}

function demarrerRouteur(conteneur, apresRendu) {
  let derniereAdresse = null;
  async function rendre() {
    const adresse = location.hash;
    const memeAdresse = adresse === derniereAdresse;
    const positionAvant = window.scrollY;
    const r = routeCourante();
    const rendu = routes.get(r.page) || routes.get("accueil");
    conteneur.innerHTML = await rendu(r);
    conteneur.focus({ preventScroll: true });
    window.scrollTo({ top: memeAdresse ? positionAvant : 0, behavior: "instant" });
    derniereAdresse = adresse;
    apresRendu?.(r);
  }
  window.addEventListener("hashchange", rendre);
  return rendre;
}

// Recherche et exploration : filtres obligatoires (8.3), horizons (8.4), tris (8.5),
// doublons inter-sources jamais fusionnés (3.2).
const HORIZONS = [
  { cle: "1", lib: "< 1 h" }, { cle: "6", lib: "< 6 h" }, { cle: "24", lib: "< 24 h" },
  { cle: "72", lib: "< 3 j" }, { cle: "168", lib: "< 7 j" }, { cle: "720", lib: "< 30 j" },
  { cle: "plus", lib: "Plus tard" }
];
const TRIS = [
  { cle: "pertinent", lib: "Pertinent pour moi" },
  { cle: "echeance", lib: "Résolution la plus proche" },
  { cle: "nouveau", lib: "Nouveau" },
  { cle: "volume", lib: "Plus gros volume" },
  { cle: "variation", lib: "Variation 24 h" },
  { cle: "50", lib: "Proche de 50 %" },
  { cle: "activite", lib: "Activité récente" }
];

function score(m) {
  let s = 0;
  if (etat.prefs.themesSuivis.includes(m.theme)) s += 40;
  if (m.regions.some((r) => etat.prefs.regionsSuivies.includes(r))) s += 30;
  if (m.closeAt && new Date(m.closeAt) - Date.now() < etat.prefs.horizonPrefereH * 3600e3) s += 30;
  if (m.tradable) s += 15;
  s += Math.min(15, (m.volume24h || 0) / 100000);
  if (etat.prefs.masques.includes(m.theme)) s -= 1000;
  if (m.closeAt && new Date(m.closeAt) - Date.now() > 90 * 24 * 3600e3) s -= 10;
  return s;
}

function filtrerMarches(q) {
  let liste = etat.marches.filter((m) => m.status === "OPEN" || q.statut === "tous");
  if (q.q) {
    const t = q.q.toLowerCase();
    liste = liste.filter((m) => m.titleOriginal.toLowerCase().includes(t) ||
      m.theme.toLowerCase().includes(t) ||
      (m.descriptionOriginal || "").toLowerCase().includes(t));
  }
  if (q.source) liste = liste.filter((m) => m.source === q.source);
  if (q.theme) liste = liste.filter((m) => m.theme === q.theme);
  if (q.region && q.region !== "France & Europe") liste = liste.filter((m) => m.regions.includes(q.region));
  if (q.region === "France & Europe") liste = liste.filter((m) => m.regions.some((r) => ["France", "Europe"].includes(r)));
  if (q.horizon && q.horizon !== "plus") {
    liste = liste.filter((m) => m.closeAt && new Date(m.closeAt) - Date.now() < Number(q.horizon) * 3600e3);
  }
  if (q.horizon === "plus") liste = liste.filter((m) => m.closeAt && new Date(m.closeAt) - Date.now() >= 720 * 3600e3);
  if (q.tradable === "1") liste = liste.filter((m) => m.tradable);
  if (q.favoris === "1") liste = liste.filter((m) => etat.favoris.has(m.id));
  if (q.position === "1") liste = liste.filter((m) => etat.positions.some((p) => p.marcheId === m.id));

  const tri = q.tri || "pertinent";
  const cmp = {
    pertinent: (a, b) => score(b) - score(a),
    echeance: (a, b) => new Date(a.closeAt || 8e15) - new Date(b.closeAt || 8e15),
    nouveau: (a, b) => (b.volume24h || 0) / Math.max(1, b.volume || 1) - (a.volume24h || 0) / Math.max(1, a.volume || 1),
    volume: (a, b) => (b.volume || 0) - (a.volume || 0),
    variation: (a, b) => {
      const va = (x) => { const i = x.issues[0]; return i?.prob != null && i.prev24h != null ? Math.abs(i.prob - i.prev24h) : 0; };
      return va(b) - va(a);
    },
    "50": (a, b) => {
      const d = (x) => { const i = x.issues[0]; return i?.prob == null ? 1 : Math.abs(i.prob - 0.5); };
      return d(a) - d(b);
    },
    activite: (a, b) => (b.volume24h || 0) - (a.volume24h || 0)
  }[tri] || ((a, b) => score(b) - score(a));
  return liste.sort(cmp);
}

function lien(q, patch) {
  const p = new URLSearchParams({ ...q, ...patch });
  [...p.entries()].forEach(([k, v]) => { if (!v) p.delete(k); });
  return `#/recherche?${p.toString()}`;
}
