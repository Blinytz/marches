<title>Éclats Marchés · prototype Phase A</title>
<style>
/* Éclats Marchés · système visuel Phase A
   Tokens : section 10.3 du hand-off. Sombre par défaut, thème clair cohérent.
   Grille 4 px · rayons 12/8 · bordures plutôt qu'ombres en sombre. */

:root {
  --bg: #090D14;
  --surface-1: #0F1622;
  --surface-2: #151E2C;
  --surface-3: #1C2737;
  --border: #263346;
  --text-1: #F3F6FA;
  --text-2: #A9B5C6;
  --text-3: #718096;
  --accent: #8B7CFF;
  --accent-hover: #A195FF;
  --yes: #20C997;
  --yes-muted: #123D36;
  --no: #FF6B6B;
  --no-muted: #48252A;
  --warning: #F5B942;
  --info: #4DA3FF;
  --success: #39D98A;
  --accent-fond: rgba(139, 124, 255, 0.12);
  --ombre: 0 6px 24px rgba(0, 0, 0, 0.35);
  --r-carte: 12px;
  --r-bouton: 9px;
}

/* « clair » est le nom interne ; « light » est la valeur stampée par les visionneuses
   externes (aperçu publié). Les deux doivent donner le même thème. */
html[data-theme="clair"], html[data-theme="light"] {
  --bg: #F4F6FA;
  --surface-1: #FFFFFF;
  --surface-2: #EDF1F7;
  --surface-3: #E2E8F2;
  --border: #C9D4E3;
  --text-1: #101828;
  --text-2: #47566B;
  --text-3: #7A8AA0;
  --accent: #6A58E8;
  --accent-hover: #5847D6;
  --yes: #0E9F76;
  --yes-muted: #D3F3E8;
  --no: #E04F4F;
  --no-muted: #FBDCDC;
  --accent-fond: rgba(106, 88, 232, 0.10);
  --ombre: 0 6px 20px rgba(20, 30, 50, 0.10);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text-1);
  font-size: 15px;
  line-height: 1.5;
  padding-bottom: 76px; /* place pour la nav mobile */
  overflow-x: hidden; /* le contenu large défile dans ses propres conteneurs */
}
@media (min-width: 768px) { body { padding-bottom: 0; } }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; }
h1 { font-size: 1.35rem; font-weight: 700; margin: 0.4rem 0 0.8rem; }
h2 { font-size: 1.02rem; font-weight: 600; margin: 1.6rem 0 0.6rem; }
h3 { font-size: 0.92rem; font-weight: 600; margin: 0.4rem 0; }

.num, .proba, .solde, .montant, .compte-rebours, td.num {
  font-variant-numeric: tabular-nums;
}
.muet { color: var(--text-2); font-size: 0.85rem; }
.tres-muet { color: var(--text-3); font-size: 0.8rem; }
.vert { color: var(--yes); }
.rouge { color: var(--no); }
.orange { color: var(--warning); }

/* ===================== En-tête ===================== */

#entete {
  position: sticky; top: 0; z-index: 40;
  height: 64px;
  display: flex; align-items: center; gap: 16px;
  padding: 0 16px;
  background: color-mix(in srgb, var(--surface-1) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.logo { font-weight: 700; font-size: 1.05rem; white-space: nowrap; color: var(--accent); }
.logo-texte { color: var(--text-1); }

#recherche-globale { flex: 1; max-width: 520px; }
#champ-recherche {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-1);
  border-radius: 10px;
  padding: 8px 14px;
  outline: none;
}
#champ-recherche:focus { border-color: var(--accent); }

.entete-droite { display: flex; align-items: center; gap: 14px; margin-left: auto; }
.indicateur-tr { font-size: 0.8rem; color: var(--success); white-space: nowrap; }
.indicateur-tr.off { color: var(--warning); }
#bouton-notifs { position: relative; font-size: 1.05rem; }

#bloc-solde { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.solde { font-weight: 700; white-space: nowrap; }
.solde-claims { font-size: 0.72rem; color: var(--warning); white-space: nowrap; }

.badge-compte {
  position: absolute; top: -6px; right: -10px;
  background: var(--accent); color: white;
  font-size: 0.65rem; font-weight: 700;
  border-radius: 999px; padding: 1px 5px;
}
#nav-sections .badge-compte, #nav-mobile .badge-point { position: static; margin-left: 5px; }
.badge-point { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }

/* ===================== Navigation sections ===================== */

#nav-sections {
  position: sticky; top: 64px; z-index: 30;
  display: flex; gap: 4px;
  height: 44px; align-items: center;
  padding: 0 12px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
#nav-sections::-webkit-scrollbar { display: none; }
#nav-sections a {
  color: var(--text-2);
  padding: 5px 12px;
  border-radius: 8px;
  white-space: nowrap;
  font-size: 0.9rem;
  position: relative;
}
#nav-sections a.actif { color: var(--text-1); background: var(--accent-fond); }
#nav-sections a:hover { color: var(--text-1); }
@media (max-width: 767px) {
  #nav-sections { top: 56px; }
  #entete { height: 56px; }
  .logo-texte, #recherche-globale, .indicateur-tr { display: none; }
  #entete { gap: 8px; }
}

/* ===================== Navigation mobile ===================== */

#nav-mobile {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  display: flex;
  background: color-mix(in srgb, var(--surface-1) 96%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
#nav-mobile a {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 4px 10px;
  font-size: 0.68rem;
  color: var(--text-2);
  min-height: 44px;
}
#nav-mobile a.actif { color: var(--accent); }
.mnav-ico { font-size: 1.15rem; line-height: 1; }
@media (min-width: 768px) { #nav-mobile { display: none; } }

/* ===================== Bandeaux d'état ===================== */

#bandeaux { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
.bandeau {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-top: 10px; padding: 9px 14px;
  border-radius: 10px;
  font-size: 0.88rem;
  border: 1px solid var(--border);
  background: var(--surface-2);
}
.bandeau-panne { border-color: color-mix(in srgb, var(--no) 45%, var(--border)); color: var(--no); }
.bandeau-ws { border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); color: var(--warning); }
.bandeau-claim {
  border-color: color-mix(in srgb, var(--warning) 55%, var(--border));
  background: linear-gradient(100deg, color-mix(in srgb, var(--warning) 14%, var(--surface-2)), var(--surface-2) 65%);
  color: var(--text-1);
}
.bandeau .btn { margin-left: auto; flex-shrink: 0; }

/* ===================== Contenu ===================== */

main { max-width: 1440px; margin: 0 auto; padding: 12px 16px 48px; }
main:focus { outline: none; }

.rangee-titre { display: flex; align-items: baseline; gap: 10px; margin: 20px 0 8px; }
.rangee-titre h2 { margin: 0; }
.rangee-titre .lien-tout { margin-left: auto; font-size: 0.82rem; color: var(--accent); }

/* Rangée horizontale scrollable */
.rangee-cartes {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 258px;
  gap: 12px;
  overflow-x: auto;
  padding: 4px 2px 10px;
  scroll-snap-type: x proximity;
}
.rangee-cartes > * { scroll-snap-align: start; }

.grille-cartes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}

/* ===================== Carte marché ===================== */

.carte {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--r-carte);
  padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
  position: relative;
  transition: border-color 120ms ease, transform 120ms ease;
}
a.carte:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }

.carte-haut { display: flex; gap: 10px; align-items: flex-start; }
.carte-img {
  width: 40px; height: 40px; border-radius: 9px; flex-shrink: 0;
  object-fit: cover; background: var(--surface-3);
  display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
}
.carte-titre {
  font-weight: 600; font-size: 0.9rem; line-height: 1.32;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: break-word;
}
/* Les enfants flex doivent pouvoir rétrécir sous leur contenu (mobile) */
.carte > *, .carte-haut > *, .ligne-compacte > *, .ligne-issue > *,
.pos-entetes > *, .carte-editoriale > * { min-width: 0; }
.carte-etoile {
  margin-left: auto; flex-shrink: 0;
  background: none; border: none; font-size: 1rem; color: var(--text-3);
  padding: 2px; line-height: 1;
}
.carte-etoile.actif { color: var(--warning); }

.carte-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.75rem; color: var(--text-3); }

.badge-source {
  font-size: 0.66rem; font-weight: 700; letter-spacing: 0.4px;
  border-radius: 5px; padding: 2px 6px;
  text-transform: uppercase;
}
.badge-source.polymarket { background: rgba(77, 163, 255, 0.16); color: var(--info); border: 1px solid rgba(77, 163, 255, 0.4); }
.badge-source.manifold { background: rgba(139, 124, 255, 0.14); color: var(--accent); border: 1px solid rgba(139, 124, 255, 0.4); }

.pastille {
  border: 1px solid var(--border); border-radius: 999px;
  padding: 1px 8px; font-size: 0.72rem; white-space: nowrap; color: var(--text-2);
}
.pastille-ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 50%, var(--border)); }
.pastille-warn { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 50%, var(--border)); }
.pastille-off { color: var(--text-3); }
.pastille-no { color: var(--no); border-color: color-mix(in srgb, var(--no) 50%, var(--border)); }

.carte-proba { display: flex; align-items: baseline; gap: 8px; }
.proba-principale { font-size: 1.45rem; font-weight: 700; }
.variation { font-size: 0.78rem; font-weight: 600; }
.variation.up { color: var(--yes); }
.variation.down { color: var(--no); }
.variation.flat { color: var(--text-3); }

.carte-pied { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-3); margin-top: auto; }

.boutons-oui-non { display: flex; gap: 8px; }
.btn-oui, .btn-non {
  flex: 1; border-radius: var(--r-bouton); border: 1px solid transparent;
  padding: 7px 4px; font-weight: 700; font-size: 0.82rem;
  min-height: 34px;
}
.btn-oui { background: var(--yes-muted); color: var(--yes); }
.btn-oui:hover { border-color: var(--yes); }
.btn-non { background: var(--no-muted); color: var(--no); }
.btn-non:hover { border-color: var(--no); }

/* Liste compacte */
.liste-compacte { display: flex; flex-direction: column; }
.ligne-compacte {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  border-radius: 8px;
}
.ligne-compacte:hover { background: var(--surface-2); }
.ligne-compacte .carte-titre { -webkit-line-clamp: 2; flex: 1; font-weight: 500; }
.ligne-compacte .proba-principale { font-size: 1.05rem; }
@media (max-width: 640px) {
  .ligne-compacte .variation { display: none; }
  .ligne-compacte { flex-wrap: wrap; }
}

/* Carte éditoriale */
.carte-editoriale { grid-column: 1 / -1; flex-direction: row; gap: 16px; padding: 16px; }
.carte-editoriale .carte-img { width: 84px; height: 84px; font-size: 2rem; }
@media (max-width: 640px) { .carte-editoriale { flex-direction: column; } .carte-editoriale .carte-img { width: 56px; height: 56px; } }

/* Issues multiples inline */
.liste-issues { display: flex; flex-direction: column; gap: 4px; }
.ligne-issue {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 8px; border-radius: 8px;
}
.ligne-issue:hover { background: var(--surface-2); }
.ligne-issue .lib { flex: 1; font-size: 0.88rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ligne-issue .proba { font-weight: 700; width: 52px; text-align: right; }
.ligne-issue .btn-oui, .ligne-issue .btn-non { flex: 0 0 74px; padding: 5px 2px; min-height: 30px; }

/* ===================== Boutons et champs ===================== */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface-3); color: var(--text-1);
  border: 1px solid var(--border); border-radius: var(--r-bouton);
  padding: 8px 16px; font-weight: 600; font-size: 0.88rem;
  min-height: 38px;
  transition: background 120ms ease, border-color 120ms ease;
}
.btn:hover { border-color: var(--accent); }
.btn-principal { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-principal:hover { background: var(--accent-hover); }
.btn-discret { background: none; border-color: var(--border); color: var(--text-2); font-weight: 500; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-claim {
  background: linear-gradient(100deg, var(--warning), color-mix(in srgb, var(--warning) 70%, #ff9f43));
  border: none; color: #1a1204; font-weight: 700;
}
.btn-claim:hover { filter: brightness(1.08); }
.btn-claim-fait {
  background: var(--surface-3); color: var(--text-3); border: 1px solid var(--border);
  cursor: default; font-weight: 600;
}

.champ {
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-1);
  border-radius: 8px; padding: 8px 12px; width: 100%;
}
.champ:focus { border-color: var(--accent); outline: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chip {
  border: 1px solid var(--border); background: var(--surface-1);
  border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; color: var(--text-2);
  display: inline-flex; align-items: center; gap: 6px; min-height: 30px;
}
.chip.actif { border-color: var(--accent); color: var(--text-1); background: var(--accent-fond); }
.chip:hover { border-color: var(--accent); }

/* ===================== Fiche marché ===================== */

.fiche { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 1024px) { .fiche { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } }

.fil-ariane { font-size: 0.78rem; color: var(--text-3); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fiche-entete { display: flex; gap: 14px; align-items: flex-start; margin-top: 8px; }
.fiche-img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
.fiche-titre { font-size: 1.25rem; font-weight: 700; line-height: 1.3; margin: 0; }
.fiche-actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
.fiche-proba-bloc { display: flex; align-items: baseline; gap: 12px; margin: 12px 0 4px; flex-wrap: wrap; }
.fiche-proba { font-size: 2.2rem; font-weight: 700; }

.panneau {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--r-carte); padding: 14px 16px; margin-top: 14px;
}
.panneau h3 { margin-top: 0; }
.panneau .prose { font-size: 0.88rem; color: var(--text-2); max-width: 75ch; white-space: pre-line; }

.stats-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 9px; padding: 8px 12px; }
.stat .val { font-weight: 700; font-size: 1.02rem; }
.stat .lib { font-size: 0.72rem; color: var(--text-3); }

/* Graphique */
.graphique-conteneur { margin-top: 12px; }
.graphique-conteneur svg { width: 100%; height: auto; display: block; }
.graphique-plages { display: flex; gap: 6px; margin-top: 8px; }
.graphique-plages button {
  background: none; border: 1px solid var(--border); border-radius: 7px;
  color: var(--text-3); font-size: 0.75rem; padding: 3px 10px;
}
.graphique-plages button.actif { color: var(--text-1); border-color: var(--accent); background: var(--accent-fond); }

/* Carnet */
.carnet { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; font-size: 0.82rem; }
.carnet .col-titre { color: var(--text-3); font-size: 0.72rem; }
.carnet-ligne { display: flex; justify-content: space-between; padding: 3px 8px; border-radius: 5px; position: relative; overflow: hidden; }
.carnet-ligne .barre { position: absolute; top: 0; bottom: 0; right: 0; opacity: 0.14; }
.carnet-ligne.bid .barre { background: var(--yes); }
.carnet-ligne.ask .barre { background: var(--no); }

/* ===================== Ticket ===================== */

.ticket {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--r-carte); padding: 16px;
  position: sticky; top: 124px;
  display: flex; flex-direction: column; gap: 12px;
}
.ticket-onglets { display: flex; gap: 8px; }
.ticket-onglets button {
  flex: 1; border-radius: var(--r-bouton); padding: 8px; font-weight: 700;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
}
.ticket-onglets .on-oui.actif { background: var(--yes-muted); color: var(--yes); border-color: var(--yes); }
.ticket-onglets .on-non.actif { background: var(--no-muted); color: var(--no); border-color: var(--no); }
.raccourcis { display: flex; gap: 6px; }
.raccourcis button {
  flex: 1; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 2px; font-size: 0.8rem; color: var(--text-2); min-height: 32px;
}
.raccourcis button:hover { border-color: var(--accent); color: var(--text-1); }
.ticket-detail { font-size: 0.84rem; display: flex; flex-direction: column; gap: 4px; }
.ticket-detail div { display: flex; justify-content: space-between; }
.ticket-detail dt { color: var(--text-3); }
.ticket-note { font-size: 0.75rem; color: var(--text-3); }
.ticket-erreur { color: var(--no); font-size: 0.84rem; background: var(--no-muted); border-radius: 8px; padding: 8px 10px; }
.ticket-avert { color: var(--warning); font-size: 0.84rem; background: color-mix(in srgb, var(--warning) 12%, var(--surface-2)); border-radius: 8px; padding: 8px 10px; }
.recu { background: var(--surface-2); border-radius: 9px; padding: 10px 12px; font-size: 0.84rem; }
.recu div { display: flex; justify-content: space-between; padding: 2px 0; }

/* Bottom sheet mobile */
#voile { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 60; }
#feuille-basse {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
  background: var(--surface-1); border-top: 1px solid var(--border);
  border-radius: 16px 16px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
  max-height: 86vh; overflow-y: auto;
  animation: montee 220ms ease;
}
@keyframes montee { from { transform: translateY(40%); opacity: 0.4; } to { transform: none; opacity: 1; } }
.barre-oui-non-mobile {
  position: fixed; left: 0; right: 0; bottom: 56px; z-index: 39;
  display: flex; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface-1) 96%, transparent);
  border-top: 1px solid var(--border);
}
.barre-oui-non-mobile .btn-oui, .barre-oui-non-mobile .btn-non { min-height: 44px; font-size: 0.95rem; }
@media (min-width: 1024px) { .barre-oui-non-mobile { display: none; } }

/* ===================== En jeu ===================== */

.enjeu-entete {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-carte);
  padding: 14px 16px;
}
.segments { display: flex; gap: 8px; overflow-x: auto; margin: 14px 0 10px; scrollbar-width: none; }
.segments::-webkit-scrollbar { display: none; }

.carte-position { gap: 10px; }
.pos-entetes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .pos-entetes .carte-img { order: -2; }
  .pos-entetes .carte-titre { order: -1; flex: 1 1 calc(100% - 52px) !important; }
}
.pos-issue { font-weight: 700; font-size: 0.8rem; border-radius: 6px; padding: 2px 8px; }
.pos-issue.oui { background: var(--yes-muted); color: var(--yes); }
.pos-issue.non { background: var(--no-muted); color: var(--no); }
.pos-chiffres { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.pos-chiffres .bloc { display: flex; flex-direction: column; }
.pos-chiffres .lib { font-size: 0.7rem; color: var(--text-3); }
.pos-chiffres .val { font-weight: 700; font-size: 0.95rem; }

.carte-claim {
  border-color: color-mix(in srgb, var(--warning) 45%, var(--border));

.eclat-anim { position: relative; }
@keyframes eclatCristallin {

  60% { box-shadow: 0 0 0 14px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }

.eclat-anim.joue { animation: eclatCristallin 600ms ease-out; }
.solde-flash { animation: soldeFlash 700ms ease; }

.interrupteur { position: relative; width: 42px; height: 24px; appearance: none; background: var(--surface-3); border: 1px solid var(--border); border-radius: 999px; transition: background 150ms; }
.interrupteur:checked { background: var(--accent); border-color: var(--accent); }
.interrupteur::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--text-1); transition: transform 150ms; }

// Petite série de probabilités pseudo-aléatoire mais déterministe (seed simple)
function serie(depart, arrivee, n, seed, volMax = 0.035) {
  let x = seed;
  const pts = [];
  let p = depart;
  for (let i = 0; i < n; i++) {
    x = (x * 9301 + 49297) % 233280;
    const bruit = ((x / 233280) - 0.5) * volMax;
    const t = i / (n - 1);
    p = Math.min(0.985, Math.max(0.015, depart + (arrivee - depart) * t + bruit));
    pts.push({ t: maintenant - (n - 1 - i) * (H / 2), p: Math.round(p * 1000) / 1000 });
  }
  pts[n - 1].p = arrivee;
  return pts;
}

// État global du prototype Phase A.

const CLE_STOCKAGE = "eclats-marches-proto";

function charger() {
  try { return JSON.parse(localStorage.getItem(CLE_STOCKAGE)) || {}; }
  catch { return {}; }
}
function sauver() {
  localStorage.setItem(CLE_STOCKAGE, JSON.stringify({
    favoris: [...etat.favoris],
    claimsRecuperes: [...etat.claimsRecuperes],
    notifsLues: [...etat.notifsLues],

const memo = charger();

const etat = {
  marches: MARCHES,
  positions: POSITIONS,
  claims: CLAIMS,
  defaites: DEFAITES,
  ledger: [...LEDGER],
  reglages: REGLAGES,
  prefs: PREFS_DEMO,
  valeurNominale: VALEUR_NOMINALE,

  solde: typeof memo.solde === "number" ? memo.solde : SOLDE_DEMO,
  favoris: new Set(memo.favoris || ["pm-fed-juillet", "mf-greve-sncf"]),
  claimsRecuperes: new Set(memo.claimsRecuperes || []),

function notifier() {
  sauver();
  etat.ecouteurs.forEach((fn) => fn());
}
function surChangement(fn) { etat.ecouteurs.add(fn); }

function marche(id) { return etat.marches.find((m) => m.id === id); }

function basculerFavori(id) {
  if (etat.favoris.has(id)) etat.favoris.delete(id);
  else etat.favoris.add(id);
  notifier();
}

function notificationsNonLues() {
  return NOTIFICATIONS.filter((n) => !etat.notifsLues.has(n.id) && !n.lu);
}
function toutesNotifications() { return NOTIFICATIONS; }
function marquerNotifLue(id) { etat.notifsLues.add(id); notifier(); }
function marquerToutLu() { NOTIFICATIONS.forEach((n) => etat.notifsLues.add(n.id)); notifier(); }

function etatClaim(c) {
  if (etat.claimsRecuperes.has(c.id)) return "CLAIMED";
  return c.etat;
}
function claimsOuverts() {
  return etat.claims.filter((c) => ["CLAIMABLE", "REFUND_CLAIMABLE"].includes(etatClaim(c)));
}
function totalARecuperer() {
  return claimsOuverts().reduce((s, c) => s + c.montant, 0);
}

// Simulation de la récupération d'un claim : la vraie version passera par une fonction
// SQL atomique côté Supabase (voir TRADING_ENGINE.md). Ici : délai + crédit local unique.
const claimsEnCours = new Set();
function recupererClaim(id) {
  return new Promise((resolve, reject) => {
    const c = etat.claims.find((x) => x.id === id);
    if (!c) return reject(new Error("Claim introuvable"));
    if (claimsEnCours.has(id) || etatClaim(c) === "CLAIMED" || etatClaim(c) === "CLAIMING") {
      return reject(new Error("Déjà récupéré ou récupération en cours"));
    }
    claimsEnCours.add(id);
    setTimeout(() => {
      claimsEnCours.delete(id);
      const avant = etat.solde;
      etat.claimsRecuperes.add(id);
      etat.solde = Math.round((etat.solde + c.montant) * 100) / 100;
      etat.ledger.unshift({
        t: new Date().toISOString(),
        montant: c.montant,
        source: c.type === "REMBOURSEMENT" ? "marches_remboursement" : "marches_gain",
        libelle: (c.type === "REMBOURSEMENT" ? "Remboursement récupéré · " : "Gain récupéré · ") + c.titre
      });
      notifier();
      resolve({ avant, apres: etat.solde, montant: c.montant });
    }, 900);
  });
}

function reglerDemo(cle, valeur) {
  etat.demo[cle] = valeur;
  if (cle === "panne_polymarket") etat.sources.polymarket = valeur
    ? { etat: "panne", libelle: "Polymarket : source indisponible depuis 12 min" }
    : { etat: "ok", libelle: "Polymarket : opérationnel" };
  if (cle === "panne_manifold") etat.sources.manifold = valeur

  if (cle === "ws_deconnecte") etat.sources.websocket = valeur
    ? { etat: "deconnecte", depuisS: 42 }
    : { etat: "connecte", depuisS: 2 };
  notifier();
}

  etat.theme = etat.theme === "sombre" ? "clair" : "sombre";

}

const echap = (s) => String(s ?? "")
  .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;");

const nf2 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });

const fmt = (n) => nf2.format(n);
const fmtEclats = (n) => `${nf2.format(n)} Éclats`;
const fmtSigne = (n) => `${n >= 0 ? "+" : ""}${nf2.format(n)}`;

function fmtCompact(n) {
  if (n == null) return "?";
  if (n >= 1e6) return `${nf2.format(Math.round(n / 1e5) / 10)} M`;
  if (n >= 1e3) return `${nf0.format(Math.round(n / 1e3))} K`;
  return nf0.format(n);
}

const pct = (p) => p == null ? "?" : `${Math.round(p * 100)}%`;
const prix = (p) => p == null ? "?" : nf2.format(p * etat.valeurNominale);

function fraicheur(m) {
  if (m.status !== "OPEN") return "";
  const s = m.fraicheurS ?? 0;
  if (etat.demo.ws_deconnecte) return `<span class="pastille pastille-warn">Données retardées</span>`;
  if (m.donneesRetardees || s > 120) {
    const lib = s > 3600 ? `${Math.round(s / 3600)} h` : `${Math.round(s / 60)} min`;
    return `<span class="pastille pastille-warn">Retardé · ${lib}</span>`;
  }
  if (s <= 15) return `<span class="pastille pastille-ok">En direct</span>`;
  return `<span class="pastille pastille-off">Actualisé il y a ${s} s</span>`;
}

function tempsRestant(iso, prefixe = "") {
  if (!iso) return "échéance inconnue";
  const ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) return "échéance passée";
  const h = ms / 3600e3;
  let lib;
  if (h < 1) lib = `${Math.max(1, Math.round(ms / 60e3))} min`;
  else if (h < 48) lib = `${Math.round(h)} h`;
  else if (h < 24 * 60) lib = `${Math.round(h / 24)} j`;
  else lib = `${Math.round(h / 24 / 30)} mois`;
  return `${prefixe}${lib}`;
}

function compteReboursCourt(iso) {
  const ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) return "00:00:00";
  const s = Math.floor(ms / 1000);
  const hh = String(Math.floor(s / 3600)).padStart(2, "0");
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const ss = String(s % 60).padStart(2, "0");
  return `${hh}:${mm}:${ss}`;
}

function libelleEcheance(m) {
  if (m.status === "RESOLVED" || m.status === "CANCELLED") return "terminé";
  if (m.status === "CLOSED") return "Fermé · résolution en attente";
  if (m.expectedResolutionAt && m.resolutionTimeConfidence !== "UNKNOWN") {
    const conf = m.resolutionTimeConfidence === "EXACT" ? "" : "≈ ";
    return `résolution ${conf}${tempsRestant(m.expectedResolutionAt, "dans ")}`;
  }
  if (m.closeAt) return `clôture ${tempsRestant(m.closeAt, "dans ")}`;
  return "échéance inconnue";
}

const badgeSource = (source) =>

function pastilleStatut(m) {

  const d = (issue.prob - issue.prev24h) * 100;
  const cls = d > 0.2 ? "up" : d < -0.2 ? "down" : "flat";
  const fleche = d > 0.2 ? "▲" : d < -0.2 ? "▼" : "·";
  return `<span class="variation ${cls}">${fleche} ${nf2.format(Math.abs(d))} pts (24 h)</span>`;
}

// ------- Graphiques SVG maison (Phase A) -------

function sparkline(history, { w = 150, h = 34, depuis = null, ligne = null } = {}) {
  if (!history || history.length < 2) return `<span class="tres-muet">pas de données</span>`;
  let pts = depuis ? history.filter((p) => p.t >= depuis) : history;
  if (pts.length < 2) pts = history.slice(-2);
  const min = Math.min(...pts.map((p) => p.p)), max = Math.max(...pts.map((p) => p.p));
  const amp = Math.max(0.02, max - min);
  const x = (i) => (i / (pts.length - 1)) * w;
  const y = (p) => h - 3 - ((p - min) / amp) * (h - 6);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.p).toFixed(1)}`).join(" ");
  const monte = pts.at(-1).p >= pts[0].p;
  const coul = monte ? "var(--yes)" : "var(--no)";
  const refLigne = ligne != null && ligne >= min && ligne <= max
    ? `<line x1="0" x2="${w}" y1="${y(ligne).toFixed(1)}" y2="${y(ligne).toFixed(1)}" stroke="var(--text-3)" stroke-dasharray="3 3" stroke-width="1"/>` : "";
  return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    ${refLigne}<path d="${d}" fill="none" stroke="${coul}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}

function grapheDetaille(history, { h = 220, marqueurs = [], ligneEntree = null, plageH = null } = {}) {
  if (!history || history.length < 2) {
    return `<div class="etat-vide"><span class="ico">📈</span>Pas encore assez de données de prix pour tracer une courbe.</div>`;
  }
  const w = 720;
  let pts = plageH ? history.filter((p) => p.t >= Date.now() - plageH * 3600e3) : history;
  if (pts.length < 2) pts = history.slice(-Math.min(12, history.length));
  const min = Math.max(0, Math.min(...pts.map((p) => p.p)) - 0.04);
  const max = Math.min(1, Math.max(...pts.map((p) => p.p)) + 0.04);
  const amp = Math.max(0.05, max - min);
  const x = (t) => ((t - pts[0].t) / Math.max(1, pts.at(-1).t - pts[0].t)) * (w - 46) + 40;
  const y = (p) => h - 22 - ((p - min) / amp) * (h - 40);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(p.p).toFixed(1)}`).join(" ");
  const grille = [0.25, 0.5, 0.75].filter((g) => g > min && g < max).map((g) =>
    `<line x1="40" x2="${w - 6}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
     <text x="4" y="${(y(g) + 4).toFixed(1)}" fill="var(--text-3)" font-size="11">${Math.round(g * 100)}%</text>`).join("");
  const entree = ligneEntree != null && ligneEntree > min && ligneEntree < max
    ? `<line x1="40" x2="${w - 6}" y1="${y(ligneEntree).toFixed(1)}" y2="${y(ligneEntree).toFixed(1)}"
        stroke="var(--accent)" stroke-dasharray="5 4" stroke-width="1.4"/>
       <text x="${w - 8}" y="${(y(ligneEntree) - 5).toFixed(1)}" fill="var(--accent)" font-size="11" text-anchor="end">prix moyen d'entrée</text>` : "";
  const marks = marqueurs.filter((mk) => mk.t >= pts[0].t && mk.t <= pts.at(-1).t).map((mk) => {
    const proche = pts.reduce((a, b) => Math.abs(b.t - mk.t) < Math.abs(a.t - mk.t) ? b : a);
    const coul = mk.type === "vente" ? "var(--no)" : mk.type === "achat" ? "var(--yes)" : "var(--info)";
    return `<circle cx="${x(mk.t).toFixed(1)}" cy="${y(proche.p).toFixed(1)}" r="4.5" fill="${coul}" stroke="var(--bg)" stroke-width="1.5">
      <title>${echap(mk.titre)}</title></circle>`;
  }).join("");
  const dernier = pts.at(-1);
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Courbe de probabilité">
    ${grille}
    <path d="${d} L${x(dernier.t).toFixed(1)},${h - 20} L40,${h - 20} Z" fill="var(--accent-fond)" stroke="none"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${entree}${marks}
    <circle cx="${x(dernier.t).toFixed(1)}" cy="${y(dernier.p).toFixed(1)}" r="3.5" fill="var(--accent)"/>
  </svg>`;
}

// ------- Calculs de position (affichage seulement, la vraie compta sera côté serveur) -------

function probIssue(m, issueId) {
  const i = m.issues.find((x) => x.id === issueId);
  return i ? i.prob : null;
}

function prixLiquidation(pos) {
  const m = marche(pos.marcheId);
  if (!m) return null;
  let p = probIssue(m, pos.issueId);
  if (p == null) return null;
  if (m.source === "MANIFOLD" && m.status === "OPEN") p = Math.max(0.01, p - 0.01); // spread miroir côté vente
  return p * pos.valeurNominale;
}

function valeurPosition(pos) {
  const pu = prixLiquidation(pos);
  return pu == null ? null : pu * pos.parts;
}

function plLatent(pos) {
  const v = valeurPosition(pos);
  if (v == null) return null;
  return v - pos.montantExpose;
}

function paiementPotentiel(pos) {
  // Les lots des fixtures représentent les parts restantes après ventes partielles
  return pos.lots.reduce((s, l) => s + l.parts * l.valeurNominale, 0);
}

function historiqueIssue(pos) {
  const m = marche(pos.marcheId);
  if (!m) return [];
  const i = m.issues.find((x) => x.id === pos.issueId);
  return i?.history || [];
}

// Routeur par hash : #/page/param?query
const routes = new Map();

function enregistrer(nom, rendu) { routes.set(nom, rendu); }

function routeCourante() {
  const brut = location.hash.replace(/^#\/?/, "") || "accueil";
  const [chemin, query = ""] = brut.split("?");
  const segments = chemin.split("/").filter(Boolean);
  return {
    page: segments[0] || "accueil",
    params: segments.slice(1),
    query: Object.fromEntries(new URLSearchParams(query))
  };
}

function demarrerRouteur(conteneur, apresRendu) {
  async function rendre() {
    const r = routeCourante();
    const rendu = routes.get(r.page) || routes.get("accueil");
    conteneur.innerHTML = await rendu(r);
    conteneur.focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: "instant" });
    apresRendu?.(r);
  }
  window.addEventListener("hashchange", rendre);
  return rendre;
}

// Recherche et exploration : filtres obligatoires (8.3), horizons (8.4), tris (8.5),
// doublons inter-sources jamais fusionnés (3.2).



const HORIZONS = [
  { cle: "1", lib: "< 1 h" }, { cle: "6", lib: "< 6 h" }, { cle: "24", lib: "< 24 h" },
  { cle: "72", lib: "< 3 j" }, { cle: "168", lib: "< 7 j" }, { cle: "720", lib: "< 30 j" },
  { cle: "plus", lib: "Plus tard" }
];
const TRIS = [
  { cle: "pertinent", lib: "Pertinent pour moi" },
  { cle: "echeance", lib: "Résolution la plus proche" },
  { cle: "nouveau", lib: "Nouveau" },
  { cle: "volume", lib: "Plus gros volume" },
  { cle: "variation", lib: "Variation 24 h" },
  { cle: "50", lib: "Proche de 50 %" },
  { cle: "activite", lib: "Activité récente" }
];

function score(m) {
  let s = 0;
  if (etat.prefs.themesSuivis.includes(m.theme)) s += 40;
  if (m.regions.some((r) => etat.prefs.regionsSuivies.includes(r))) s += 30;
  if (m.closeAt && new Date(m.closeAt) - Date.now() < etat.prefs.horizonPrefereH * 3600e3) s += 30;
  if (m.tradable) s += 15;
  s += Math.min(15, (m.volume24h || 0) / 100000);
  if (etat.prefs.masques.includes(m.theme)) s -= 1000;
  if (m.closeAt && new Date(m.closeAt) - Date.now() > 90 * 24 * 3600e3) s -= 10;
  return s;
}

function filtrerMarches(q) {
  let liste = etat.marches.filter((m) => m.status === "OPEN" || q.statut === "tous");
  if (etat.demo.panne_polymarket) liste = liste.filter((m) => m.source !== "POLYMARKET");
  if (etat.demo.panne_manifold) liste = liste.filter((m) => m.source !== "MANIFOLD");
  if (q.q) {
    const t = q.q.toLowerCase();
    liste = liste.filter((m) => m.titleOriginal.toLowerCase().includes(t) ||
      m.theme.toLowerCase().includes(t) ||
      (m.descriptionOriginal || "").toLowerCase().includes(t));
  }
  if (q.source) liste = liste.filter((m) => m.source === q.source);
  if (q.theme) liste = liste.filter((m) => m.theme === q.theme);
  if (q.region && q.region !== "France & Europe") liste = liste.filter((m) => m.regions.includes(q.region));
  if (q.region === "France & Europe") liste = liste.filter((m) => m.regions.some((r) => ["France", "Europe"].includes(r)));
  if (q.horizon && q.horizon !== "plus") {
    liste = liste.filter((m) => m.closeAt && new Date(m.closeAt) - Date.now() < Number(q.horizon) * 3600e3);
  }
  if (q.horizon === "plus") liste = liste.filter((m) => m.closeAt && new Date(m.closeAt) - Date.now() >= 720 * 3600e3);
  if (q.tradable === "1") liste = liste.filter((m) => m.tradable);
  if (q.favoris === "1") liste = liste.filter((m) => etat.favoris.has(m.id));
  if (q.position === "1") liste = liste.filter((m) => etat.positions.some((p) => p.marcheId === m.id));

  const tri = q.tri || "pertinent";
  const cmp = {
    pertinent: (a, b) => score(b) - score(a),
    echeance: (a, b) => new Date(a.closeAt || 8e15) - new Date(b.closeAt || 8e15),
    nouveau: (a, b) => (b.volume24h || 0) / Math.max(1, b.volume || 1) - (a.volume24h || 0) / Math.max(1, a.volume || 1),
    volume: (a, b) => (b.volume || 0) - (a.volume || 0),
    variation: (a, b) => {
      const va = (x) => { const i = x.issues[0]; return i?.prob != null && i.prev24h != null ? Math.abs(i.prob - i.prev24h) : 0; };
      return va(b) - va(a);
    },
    "50": (a, b) => {
      const d = (x) => { const i = x.issues[0]; return i?.prob == null ? 1 : Math.abs(i.prob - 0.5); };
      return d(a) - d(b);
    },
    activite: (a, b) => (b.volume24h || 0) - (a.volume24h || 0)
  }[tri] || ((a, b) => score(b) - score(a));
  return liste.sort(cmp);
}

function lien(q, patch) {
  const p = new URLSearchParams({ ...q, ...patch });
  [...p.entries()].forEach(([k, v]) => { if (!v) p.delete(k); });
  return `#/recherche?${p.toString()}`;
}

// Fiche événement/marché (9.4) + ticket de transaction (9.5).
// Le ticket est une simulation locale : la version réelle passera par la prévisualisation
// et l'exécution serveur (TRADING_ENGINE.md). États : achat, confirmation, succès, erreur.


let ticket = null; // { marcheId, issueId, mode, montant, etape, prixServeur, recu }

function ouvrirTicket(marcheId, issueId) {
  ticket = { marcheId, issueId, mode: "achat", montant: 250, etape: "saisie" };
}

function prixIndicatif(m, issueId, mode = "achat") {
  const issue = m.issues.find((i) => i.id === issueId);
  if (!issue || issue.prob == null) return null;
  let p = issue.prob;
  if (m.source === "MANIFOLD") p = mode === "achat" ? Math.min(0.99, p + 0.01) : Math.max(0.01, p - 0.01);
  else if (m.carnet) {
    p = mode === "achat" ? (m.carnet.asks[0]?.[0] ?? p) : (m.carnet.bids[0]?.[0] ?? p);
  }
  return p;
}

function htmlTicket(m) {
  if (!m.tradable || m.status !== "OPEN") {
    return `<div class="ticket"><h3>Transaction indisponible</h3>
      <p class="muet">${echap(m.nonTradableReason || (m.status === "CLOSED"
        ? "Marché fermé : résolution en attente de l'oracle source."
        : "Ce marché est terminé."))}</p>
      ${m.status === "CLOSED" ? `<p class="tres-muet">Règles et source de résolution ci-contre. Aucun paiement avant la décision officielle de la source.</p>` : ""}
    </div>`;
  }
  if (!ticket || ticket.marcheId !== m.id) ouvrirTicket(m.id, issuePrincipale(m).id);
  const t = ticket;
  const issue = m.issues.find((i) => i.id === t.issueId) || m.issues[0];
  const p = prixIndicatif(m, t.issueId, t.mode);
  const vn = etat.valeurNominale;
  const prixU = p != null ? p * vn : null;
  const pos = etat.positions.find((x) => x.marcheId === m.id);
  const binaire = m.marketType === "BINARY";

  const onglets = binaire
    ? `<div class="ticket-onglets">
        <button class="on-oui ${t.issueId === "oui" ? "actif" : ""}" data-ticket="issue" data-val="oui">OUI ${Math.round((m.issues.find(i => i.id === "oui")?.prob ?? 0) * 100)}</button>
        <button class="on-non ${t.issueId === "non" ? "actif" : ""}" data-ticket="issue" data-val="non">NON ${Math.round((m.issues.find(i => i.id === "non")?.prob ?? 0) * 100)}</button>
      </div>`
    : `<select class="champ" data-ticket="issue-select" aria-label="Issue">
        ${m.issues.map((i) => `<option value="${i.id}" ${i.id === t.issueId ? "selected" : ""}>${echap(i.label)} · ${pct(i.prob)}</option>`).join("")}
      </select>`;

  const modeBoutons = `<div class="ticket-onglets" style="margin-top:2px">
    <button class="${t.mode === "achat" ? "actif on-oui" : ""}" data-ticket="mode" data-val="achat">Acheter</button>
    <button class="${t.mode === "vente" ? "actif on-non" : ""}" data-ticket="mode" data-val="vente" ${pos ? "" : "disabled title='Aucune position à vendre'"}>Vendre</button>
  </div>`;

  if (t.etape === "succes") {
    const r = t.recu;
    return `<div class="ticket eclat-anim joue">
      <h3>✅ ${t.mode === "achat" ? "Achat exécuté" : "Vente exécutée"}</h3>
      <div class="recu">
        <div><span>Marché</span><strong style="text-align:right; max-width:60%">${echap(m.titleOriginal.slice(0, 60))}${m.titleOriginal.length > 60 ? "…" : ""}</strong></div>
        <div><span>Issue</span><strong>${echap(issue.label)}</strong></div>
        <div><span>${t.mode === "achat" ? "Montant débité" : "Produit crédité"}</span><strong>${fmtEclats(r.montant)}</strong></div>
        <div><span>Frais</span><strong>0 Éclats</strong></div>
        <div><span>Parts</span><strong>${fmt(r.parts)}</strong></div>
        <div><span>Prix moyen</span><strong>${fmt(r.prix)}</strong></div>
        ${t.mode === "achat" ? `<div><span>Paiement maximal</span><strong>${fmtEclats(r.parts * vn)}</strong></div>
        <div><span>Bénéfice maximal</span><strong class="vert">+${fmt(r.parts * vn - r.montant)}</strong></div>` : ""}
        <div><span>Transaction</span><span class="id-support">${r.id}</span></div>
      </div>
      <a class="btn btn-principal" href="#/enjeu">Voir ma position</a>
      <button class="btn btn-discret" data-ticket="reinit">Nouvelle transaction</button>
      <p class="ticket-note">Simulation Phase A : aucun Éclat réel n'a bougé.</p>
    </div>`;
  }

  if (t.etape === "confirmation") {
    const pServeur = t.prixServeur;
    const ecartPts = Math.abs(pServeur - p) * 100;

      <h3>Confirmer ${t.mode === "achat" ? "l'achat" : "la vente"}</h3>

        <div><dt>Paiement maximal</dt><dd class="num">${fmt(parts * vn)}</dd></div>

      ${horsTolerance ? `<div class="ticket-avert">⚠ Le prix a bougé de ${fmt(ecartPts)} points depuis votre saisie,

      </button>
      <button class="btn btn-discret" data-ticket="retour">Retour</button>
    </div>`;
  }

  const soldeDispo = etat.demo.solde_insuffisant ? 12 : etat.solde;
  const montantOk = t.montant >= 10 && t.montant <= 10000;
  const soldeOk = t.mode === "vente" || t.montant <= soldeDispo;
  const parts = prixU ? t.montant / prixU : 0;
  const profondeurInsuffisante = m.profondeurFaible && t.mode === "achat" && t.montant > 25;

  return `<div class="ticket">

// Interactions du ticket (délégation accrochée par app.js après chaque rendu de fiche)
function accrocherTicket(rerendre) {
  const zone = document.getElementById("zone-ticket") || document.getElementById("feuille-basse");
  if (!zone) return;
  zone.addEventListener("input", (e) => {
    const cible = e.target.closest("[data-ticket=montant]");
    if (cible && ticket) { ticket.montant = Math.max(0, Number(cible.value) || 0); rafraichirSansFocus(rerendre); }
  });
  zone.addEventListener("change", (e) => {
    const sel = e.target.closest("[data-ticket=issue-select]");
    if (sel && ticket) { ticket.issueId = sel.value; rerendre(); }
  });
  zone.addEventListener("click", (e) => {
    const b = e.target.closest("[data-ticket]");
    if (!b || !ticket) return;
    const type = b.dataset.ticket;
    if (type === "issue") { ticket.issueId = b.dataset.val; rerendre(); }
    if (type === "mode") { ticket.mode = b.dataset.val; rerendre(); }
    if (type === "rapide") { ticket.montant = Number(b.dataset.val); rerendre(); }
    if (type === "retour") { ticket.etape = "saisie"; rerendre(); }
    if (type === "reinit") { ticket.etape = "saisie"; ticket.montant = 250; rerendre(); }
    if (type === "previsualiser") {
      const m = marche(ticket.marcheId);
      const p = prixIndicatif(m, ticket.issueId, ticket.mode);
      // Simulation de la relecture serveur : légère dérive, forte si la bascule démo est active
      const derive = etat.demo.prix_modifie ? 0.04 : (Math.random() - 0.5) * 0.006;
      ticket.prixServeur = Math.min(0.99, Math.max(0.01, p + derive));
      ticket.etape = "confirmation";
      rerendre();
    }
    if (type === "executer") {
      const m = marche(ticket.marcheId);
      const vn = etat.valeurNominale;
      ticket.recu = {
        id: "tx-demo-" + Math.random().toString(36).slice(2, 8),
        montant: ticket.montant,
        prix: ticket.prixServeur * vn,
        parts: ticket.montant / (ticket.prixServeur * vn)
      };
      ticket.etape = "succes";
      rerendre();
    }
  });
}

function rafraichirSansFocus(rerendre) {
  const actif = document.activeElement;
  const id = actif?.id;
  const posCurseur = actif?.selectionStart;
  rerendre();
  if (id) {
    const el = document.getElementById(id);
    if (el) { el.focus(); try { el.selectionStart = el.selectionEnd = posCurseur; } catch {} }
  }
}

function ticketPourFeuille(marcheId, issueId) {
  ouvrirTicket(marcheId, issueId);
  const m = marche(marcheId);
  return htmlTicket(m);
}
function htmlTicketCourant() {
  if (!ticket) return "";
  return htmlTicket(marche(ticket.marcheId));
}

function segmentDe(pos) {
  const m = marche(pos.marcheId);
  if (!m) return "tous";
  if (m.status === "CLOSED") return "fermes";
  const restant = m.expectedResolutionAt ? new Date(m.expectedResolutionAt) - Date.now() : Infinity;
  if (restant < 24 * 3600e3) return "bientot";
  if (restant > 30 * 24 * 3600e3) return "long";
  return "actifs";
}

function pageEnjeu({ query }) {
  if (etat.demo.chargement) {
    return `<h1>En jeu</h1><div class="enjeu-entete skeleton" style="height:90px"></div>
      ${Array(3).fill('<div class="carte skeleton" style="height:150px; margin-top:12px"></div>').join("")}`;
  }
  const positions = etat.positions;
  if (!positions.length) {
    return `<h1>En jeu</h1>` + etatVide("🎯", "Aucune position ouverte",
      "Achetez OUI ou NON sur un marché : votre position vivra ici, avec sa courbe, son P&L et son échéance.",
      `<a class="btn btn-principal" href="#/recherche?horizon=24&tradable=1">Voir les marchés courts</a>`);
  }

  const segment = query.seg || "tous";
  const deplie = query.detail || null;
  const claims = claimsOuverts();

  const enrichies = positions.map((pos) => ({ pos, seg: segmentDe(pos), pl: plLatent(pos) }));
  const visibles = segment === "tous" ? enrichies
    : segment === "recuperer" ? []
    : enrichies.filter((x) => x.seg === segment);

  const totalExpose = positions.reduce((s, p) => s + p.montantExpose, 0);
  const totalValeur = enrichies.reduce((s, x) => s + (valeurPosition(x.pos) ?? x.pos.montantExpose), 0);
  const totalPl = totalValeur - totalExpose;
  const paiementMax = positions.reduce((s, p) => s + paiementPotentiel(p), 0);
  const favorables = enrichies.filter((x) => (x.pl ?? 0) >= 0).length;
  const prochaine = positions
    .map((p) => marche(p.marcheId)?.expectedResolutionAt).filter(Boolean)
    .sort((a, b) => new Date(a) - new Date(b))[0];

  const tri = query.tri || "echeance";
  visibles.sort((a, b) => {
    if (tri === "pl") return (b.pl ?? -1e9) - (a.pl ?? -1e9);
    if (tri === "pire") return (a.pl ?? 1e9) - (b.pl ?? 1e9);
    if (tri === "enjeu") return b.pos.montantExpose - a.pos.montantExpose;
    const ea = marche(a.pos.marcheId)?.expectedResolutionAt || "9999";
    const eb = marche(b.pos.marcheId)?.expectedResolutionAt || "9999";
    return new Date(ea) - new Date(eb);
  });

  const lienSeg = (s) => `#/enjeu?seg=${s}${tri !== "echeance" ? "&tri=" + tri : ""}`;

// « serveur » (simulée en Phase A), animation de transfert vers le solde.


function carteClaim(c) {
  const e = etatClaim(c);
  const estRemboursement = c.type === "REMBOURSEMENT";
  const benefice = c.montant - c.mise;
  if (e === "CLAIMED") {
    return `<div class="carte" style="margin-bottom:10px">
      <div class="pos-entetes">${badgeSource(c.source)}
        <span class="carte-titre" style="flex:1">${echap(c.titre)}</span>
        <span class="muet num">mise ${fmt(c.mise)} → ${estRemboursement ? "remboursé" : "payé"} ${fmt(c.montant)}</span>
      </div>
      <button class="btn btn-claim-fait" disabled>✓ ${estRemboursement ? "Remboursement récupéré" : "Gain récupéré"} · +${fmt(c.montant)} Éclats</button>
    </div>`;
  }
  if (e === "CLAIMING") {
    return `<div class="carte carte-claim" style="margin-bottom:10px">
      <div class="pos-entetes">${badgeSource(c.source)}
        <span class="carte-titre" style="flex:1">${echap(c.titre)}</span>
        <span class="claim-montant num">${fmt(c.montant)}</span>
      </div>
      <button class="btn btn-claim" disabled>Récupération…</button>
      <p class="tres-muet">Une erreur réseau pendant la récupération ne provoque jamais de double crédit : l'état est relu côté serveur avant toute nouvelle tentative.</p>
    </div>`;
  }
  return `<div class="carte carte-claim eclat-anim" style="margin-bottom:10px" data-claim-carte="${c.id}">
    <div class="pos-entetes">${badgeSource(c.source)}
      <span class="carte-titre" style="flex:1">${echap(c.titre)}</span>
      <span class="claim-montant num">${fmt(c.montant)}</span>
    </div>
    <p class="pos-message">
      ${estRemboursement
        ? `${echap(c.raison || "Marché annulé par la source.")} Remboursement du coût d'acquisition restant : ${fmtEclats(c.montant)}.`
        : `Issue gagnante : ${echap(c.issueLabel)} · mise ${fmt(c.mise)} → paiement ${fmt(c.montant)} · bénéfice net ${fmtSigne(benefice)}`}
    </p>
    <button class="btn btn-claim" data-action="recuperer" data-claim="${c.id}">
      ${estRemboursement ? "Récupérer le remboursement" : `Récupérer ${fmt(c.montant)} Éclats`}
    </button>
  </div>`;
}

// ---------- Animation de récupération d'un claim ----------

function animerTransfertClaim(depuisEl, montant) {
  const solde = document.getElementById("solde-valeur");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !depuisEl) {
    solde.classList.add("solde-flash");
    setTimeout(() => solde.classList.remove("solde-flash"), 800);
    return;
  }
  const dep = depuisEl.getBoundingClientRect();
  const arr = solde.getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const p = document.createElement("span");
    p.className = "particule";
    p.textContent = "◇";
    p.style.left = `${dep.left + dep.width / 2 + (i - 3) * 8}px`;
    p.style.top = `${dep.top}px`;
    document.body.appendChild(p);
    requestAnimationFrame(() => {
      setTimeout(() => {
        p.style.transform = `translate(${arr.left - dep.left - (i - 3) * 8 + arr.width / 2}px, ${arr.top - dep.top}px) scale(0.5)`;
        p.style.opacity = "0";
      }, i * 45);
    });
    setTimeout(() => p.remove(), 900 + i * 45);
  }
  // Compteur : de l'ancien au nouveau solde
  const cible = etat.solde;
  const depart = cible - montant;
  const t0 = performance.now();
  const duree = 650;
  function tick(t) {
    const x = Math.min(1, (t - t0) / duree);
    solde.textContent = `◇ ${fmt(depart + (cible - depart) * (1 - Math.pow(1 - x, 3)))}`;
    if (x < 1) requestAnimationFrame(tick);
  }
  setTimeout(() => {
    solde.classList.add("solde-flash");
    requestAnimationFrame(tick);
    setTimeout(() => solde.classList.remove("solde-flash"), 900);
  }, 500);
}

// ---------- Délégation d'événements globale ----------

document.body.addEventListener("click", async (e) => {
  const fav = e.target.closest("[data-fav]");
  if (fav) { e.preventDefault(); basculerFavori(fav.dataset.fav); rendre(); return; }

  const act = e.target.closest("[data-action]");
  if (!act) return;
  const a = act.dataset.action;

  if (a === "ticket") {
    e.preventDefault();
    location.hash = `#/marche/${act.dataset.marche}?issue=${act.dataset.issue}&t=1`;
  }
  if (a === "ticket-mobile") {
    e.preventDefault();
    ouvrirFeuille(ticketPourFeuille(act.dataset.marche, act.dataset.issue));
  }
  if (a === "recuperer") {
    e.preventDefault();
    const bouton = act;
    const carte = bouton.closest("[data-claim-carte]");
    bouton.disabled = true;
    bouton.textContent = "Récupération…";
    try {
      const res = await recupererClaim(bouton.dataset.claim);
      carte?.classList.add("joue");
      animerTransfertClaim(bouton, res.montant);
      setTimeout(() => rendre(), 750);
    } catch {
      rendre(); // état relu : le bouton reflète la réalité (jamais deviné)
    }
  }
  if (a === "deplier-pos") {
    e.preventDefault();
    const r = routeCourante();
    const dejaOuvert = r.query.detail === act.dataset.pos;
    const q = new URLSearchParams({ ...r.query });
    if (dejaOuvert) q.delete("detail"); else q.set("detail", act.dataset.pos);
    location.hash = `#/enjeu?${q.toString()}`;
  }
  if (a === "basculer-theme") { basculerTheme(); rendre(); }
  if (a === "tout-lu") { marquerToutLu(); rendre(); }
  if (a === "lire-notif") { marquerNotifLue(act.dataset.notif); }
  if (a === "suivre-theme") {
    const t = act.dataset.theme;
    const i = etat.prefs.themesSuivis.indexOf(t);
    if (i >= 0) etat.prefs.themesSuivis.splice(i, 1); else etat.prefs.themesSuivis.push(t);
    notifier(); rendre();
  }
  if (a === "suivre-region") {
    const r = act.dataset.region;
    const i = etat.prefs.regionsSuivies.indexOf(r);
    if (i >= 0) etat.prefs.regionsSuivies.splice(i, 1); else etat.prefs.regionsSuivies.push(r);
    notifier(); rendre();
  }
  if (a === "demasquer") {
    e.preventDefault();
    etat.prefs.masques = etat.prefs.masques.filter((t) => t !== act.dataset.theme);
    notifier(); rendre();
  }
  if (a === "enregistrer-filtre") {
    act.textContent = "✓ Filtre enregistré dans Ma liste";
    etat.prefs.filtresEnregistres.push({ id: "f" + Date.now(), nom: "Filtre du " + new Date().toLocaleDateString("fr-FR"), criteres: "Critères actuels de la recherche" });
    notifier();
  }
  if (a === "notif-test") {
    act.textContent = "✓ Notification de test envoyée au centre interne";
  }
});
