<!DOCTYPE html>
<html lang="fr" data-theme="clair">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F1F0FB">
  <title>Marchés</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Barre démo Phase A : bascule des états d'interface (section 11) -->
  <aside id="barre-demo" class="repliee" aria-label="Contrôles de démonstration">
    <button id="demo-toggle" title="Contrôles de démonstration du prototype">🧪 Démo</button>
    <div id="demo-panneau">
      <p class="demo-titre">Prototype Phase A · états simulés</p>
      <label><input type="checkbox" data-demo="panne_polymarket"> Panne Polymarket</label>
      <label><input type="checkbox" data-demo="panne_manifold"> Panne Manifold</label>
      <label><input type="checkbox" data-demo="ws_deconnecte"> WebSocket déconnecté</label>
      <label><input type="checkbox" data-demo="chargement"> Skeletons de chargement</label>
      <label><input type="checkbox" data-demo="solde_insuffisant"> Solde insuffisant (ticket)</label>
      <label><input type="checkbox" data-demo="prix_modifie"> Prix modifié avant confirmation</label>
      <label><input type="checkbox" data-demo="erreur_inconnue"> Erreur inconnue (fiche)</label>
      <button id="demo-reset" class="btn btn-discret">Réinitialiser la démo</button>
    </div>
  </aside>

  <header id="entete">
    <a class="logo" href="#/accueil">✦ <span class="logo-texte">Marchés</span></a>
    <div id="recherche-globale">
      <input id="champ-recherche" type="search" placeholder="Rechercher un marché…  ( / )"
             autocomplete="off" aria-label="Recherche globale">
    </div>
    <div class="entete-droite">
      <span id="indicateur-tr" class="indicateur-tr" title="Connexion temps réel">⚡ <span>En direct</span></span>
      <a id="btn-recherche-mobile" href="#/recherche" title="Rechercher" aria-label="Rechercher">🔍</a>
      <a id="bouton-notifs" href="#/notifications" title="Notifications">🔔<span id="badge-notifs" class="badge-compte" hidden></span></a>
      <a id="bloc-solde" href="#/portefeuille" title="Portefeuille">
        <span id="solde-valeur" class="solde">◇ …</span>
        <span id="solde-claims" class="solde-claims" hidden></span>
      </a>
    </div>
  </header>

  <!-- Navigation : 5 piliers · Marchés · Positions · Portefeuille · Résultats · Statistiques -->
  <nav id="nav-principale" aria-label="Sections principales">
    <a href="#/accueil" data-primaire="marches"><span class="np-ico">🏛️</span>Marchés</a>
    <a href="#/enjeu" data-primaire="positions"><span class="np-ico">🎯</span>Positions<span class="badge-nombre" data-badge="positions" hidden></span></a>
    <a href="#/portefeuille" data-primaire="portefeuille"><span class="np-ico eclat">◆</span>Portefeuille</a>
    <a href="#/resultats" data-primaire="resultats"><span class="np-ico">🏆</span>Résultats<span class="badge-point or" data-badge="resultats" title="Des Éclats vous attendent" hidden></span></a>
    <a href="#/stats" data-primaire="stats"><span class="np-ico">📊</span>Statistiques</a>
  </nav>

  <!-- Sous-navigation contextuelle (uniquement sous Marchés), rendue par app.js -->
  <div id="sous-nav" aria-label="Sous-sections"></div>

  <div id="bandeaux"></div>

  <main id="contenu" tabindex="-1"></main>

  <!-- Barre basse mobile : mêmes 5 piliers -->
  <nav id="nav-mobile" aria-label="Navigation principale">
    <a href="#/accueil" data-primaire="marches"><span class="mnav-ico">🏛️</span>Marchés</a>
    <a href="#/enjeu" data-primaire="positions"><span class="mnav-ico">🎯</span>Positions<span class="badge-nombre" data-badge="positions-m" hidden></span></a>
    <a href="#/portefeuille" data-primaire="portefeuille"><span class="mnav-ico eclat">◆</span>Portefeuille</a>
    <a href="#/resultats" data-primaire="resultats"><span class="mnav-ico">🏆</span>Résultats<span class="badge-point or" data-badge="resultats-m" hidden></span></a>
    <a href="#/stats" data-primaire="stats"><span class="mnav-ico">📊</span>Statistiques</a>
  </nav>

  <div id="voile" hidden></div>
  <div id="feuille-basse" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
