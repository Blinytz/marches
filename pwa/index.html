<!DOCTYPE html>
<html lang="fr" data-theme="sombre">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090D14">
  <title>Éclats Marchés</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Barre démo Phase A : bascule des états d'interface (section 11) -->
  <aside id="barre-demo" class="repliee" aria-label="Contrôles de démonstration">
    <button id="demo-toggle" title="Contrôles de démonstration du prototype">🧪 Démo</button>
    <div id="demo-panneau">
      <p class="demo-titre">Prototype Phase A · états simulés</p>
      <label><input type="checkbox" data-demo="panne_polymarket"> Panne Polymarket</label>
      <label><input type="checkbox" data-demo="panne_manifold"> Panne Manifold</label>
      <label><input type="checkbox" data-demo="ws_deconnecte"> WebSocket déconnecté</label>
      <label><input type="checkbox" data-demo="chargement"> Skeletons de chargement</label>
      <label><input type="checkbox" data-demo="solde_insuffisant"> Solde insuffisant (ticket)</label>
      <label><input type="checkbox" data-demo="prix_modifie"> Prix modifié avant confirmation</label>
      <label><input type="checkbox" data-demo="erreur_inconnue"> Erreur inconnue (fiche)</label>
      <button id="demo-reset" class="btn btn-discret">Réinitialiser la démo</button>
    </div>
  </aside>

  <header id="entete">
    <a class="logo" href="#/accueil">✦ <span class="logo-texte">Éclats Marchés</span></a>
    <div id="recherche-globale">
      <input id="champ-recherche" type="search" placeholder="Rechercher un marché…  ( / )"
             autocomplete="off" aria-label="Recherche globale">
    </div>
    <div class="entete-droite">
      <span id="indicateur-tr" class="indicateur-tr" title="Connexion temps réel">⚡ <span>En direct</span></span>
      <a id="bouton-notifs" href="#/notifications" title="Notifications">🔔<span id="badge-notifs" class="badge-compte" hidden></span></a>
      <a id="bloc-solde" href="#/portefeuille" title="Portefeuille">
        <span id="solde-valeur" class="solde">◇ …</span>
        <span id="solde-claims" class="solde-claims" hidden></span>
      </a>
    </div>
  </header>

  <nav id="nav-sections" aria-label="Sections">
    <a href="#/accueil" data-section="accueil">Pour moi</a>
    <a href="#/recherche?horizon=24" data-section="24h">24 h</a>
    <a href="#/recherche?region=France%20%26%20Europe" data-section="fr-eu">France &amp; Europe</a>
    <a href="#/recherche?tri=nouveau" data-section="nouveaux">Nouveaux</a>
    <a href="#/recherche?tri=volume" data-section="populaires">Populaires</a>
    <a href="#/recherche?vue=themes" data-section="themes">Thèmes</a>
    <a href="#/enjeu" data-section="enjeu">En jeu<span id="badge-enjeu" class="badge-compte" hidden></span></a>
    <a href="#/favoris" data-section="favoris">Ma liste</a>
  </nav>

  <div id="bandeaux"></div>

  <main id="contenu" tabindex="-1"></main>

  <nav id="nav-mobile" aria-label="Navigation principale">
    <a href="#/accueil" data-mnav="marches"><span class="mnav-ico">🏛️</span>Marchés</a>
    <a href="#/recherche" data-mnav="recherche"><span class="mnav-ico">🔍</span>Recherche</a>
    <a href="#/portefeuille" data-mnav="portefeuille"><span class="mnav-ico">◇</span>Portefeuille</a>
    <a href="#/resultats" data-mnav="resultats"><span class="mnav-ico">🏆</span>Résultats<span id="badge-resultats" class="badge-point" hidden></span></a>
  </nav>

  <div id="voile" hidden></div>
  <div id="feuille-basse" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
